<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MRes Supervision Hub</title>
<style>
  /* ============================================================
     DESIGN TOKENS
     Palette: calm neutral greys with a muted teal accent. Low-saturation
     status colours (amber / clay / green / blue) so long screens of tables
     stay easy on the eye. Every accent has a matching -soft background and
     -ink text token, so nothing is hard-coded per component.
     ============================================================ */
  :root{
    --ink:#1e242b;
    --ink-soft:#5a6672;
    --paper:#f4f6f8;
    --paper-2:#ffffff;
    --line:#e3e7ec;
    --line-strong:#c8cfd7;
    --teal:#3f7d78;
    --teal-deep:#2f5f5c;
    --teal-tint:#3f7d7814;
    --amber:#96690c;
    --amber-soft:#f7ecd6;
    --amber-ink:#7d5709;
    --clay:#b0503a;
    --clay-soft:#f7e3dd;
    --clay-ink:#8c3d2a;
    --green:#3d7d55;
    --green-soft:#dfeee4;
    --green-ink:#2c5c3d;
    --blue:#41689b;
    --blue-soft:#e4eaf4;
    --blue-ink:#34527c;
    --neutral-soft:#edf0f3;
    --neutral-ink:#616b76;
    --shadow:0 1px 2px rgba(20,28,38,.05),0 10px 24px -18px rgba(20,28,38,.35);
    --r:10px;
  }
  *{box-sizing:border-box}

  /* ---- Dark mode -------------------------------------------------------
     Applied by JS as html[data-theme="dark"]; defaults to the system
     preference, and the header moon/sun button remembers the user's choice.
     Same "field notebook" character, printed on dark stock. ------------- */
  html[data-theme="dark"]{
    color-scheme:dark;
    --ink:#e4e8ec; --ink-soft:#9aa5b1;
    --paper:#161a1f; --paper-2:#1f242b;
    --line:#2e353d; --line-strong:#454e58;
    --teal:#4f9a94; --teal-deep:#9ed6d0; --teal-tint:#4f9a9426;
    --amber:#c3942f; --amber-soft:#3a3018; --amber-ink:#e6c489;
    --clay:#c2634a; --clay-soft:#3d221c; --clay-ink:#f0a68f;
    --green:#4a8f63; --green-soft:#1e3527; --green-ink:#9fd8ab;
    --blue:#5c86c4; --blue-soft:#25344e; --blue-ink:#aac5f0;
    --neutral-soft:#2a3138; --neutral-ink:#9aa5b1;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -18px rgba(0,0,0,.8);
  }
  html[data-theme="dark"] header.app{background:#11151a;color:var(--ink);border-bottom-color:var(--teal)}
  html[data-theme="dark"] .brand h1{color:var(--ink)}
  html[data-theme="dark"] #toast{background:#2b323a;color:var(--ink)}
  html[data-theme="dark"] tr:hover td{background:#ffffff0a}
  html[data-theme="dark"] .btn.ghost:hover{background:#ffffff0d}
  html[data-theme="dark"] code{background:#ffffff14}
  html[data-theme="dark"] nav.tabs button{background:linear-gradient(#242a31,#1d2229);box-shadow:inset 0 -6px 8px -8px rgba(0,0,0,.55)}
  html[data-theme="dark"] nav.tabs button:hover{background:var(--paper-2)}
  html[data-theme="dark"] nav.tabs button.active{background:var(--paper-2)}
  html[data-theme="dark"] .auth-wrap{background:
    repeating-linear-gradient(transparent,transparent 31px,#ffffff07 31px,#ffffff07 32px),var(--paper)}
  html[data-theme="dark"] .pill.pending{color:var(--amber-ink)}
  html[data-theme="dark"] .pill.approved,html[data-theme="dark"] .pill.held{color:var(--green-ink)}
  html[data-theme="dark"] .pill.none{background:var(--neutral-soft);color:var(--neutral-ink)}
  html[data-theme="dark"] .pill.missed{color:var(--clay-ink)}
  html[data-theme="dark"] .pill.blue,html[data-theme="dark"] .pill.area-it{color:var(--blue-ink)}
  html[data-theme="dark"] .pill.area-business{color:var(--amber-ink)}
  html[data-theme="dark"] .linkpill{color:var(--blue-ink)}
  html[data-theme="dark"] .att-cell.P{color:var(--green-ink)}
  html[data-theme="dark"] .att-cell.A{background:var(--clay-soft);color:var(--clay-ink)}
  html[data-theme="dark"] .att-cell.E{color:var(--amber-ink)}
  html[data-theme="dark"] .att-cell.-{color:#5b6570}
  html[data-theme="dark"] .stucard.active{background:var(--teal-tint)}
  html[data-theme="dark"] .ctime{background:var(--teal-tint)}
  html[data-theme="dark"] .weeklog .wrow.now{background:var(--teal-tint)}
  html[data-theme="dark"] .wksq.ok{color:var(--green-ink)}
  html[data-theme="dark"] .wksq.miss{color:var(--clay-ink)}
  html[data-theme="dark"] .wksq.heldsq{color:var(--blue-ink)}
  html[data-theme="dark"] .locknote{color:var(--amber-ink)}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    line-height:1.55;font-size:16.5px;
  }
  body, input, select, button, textarea{font-family:inherit}
  .ui{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  h1,h2,h3{font-weight:600;letter-spacing:-.01em;line-height:1.15;margin:0}
  a{color:var(--teal-deep)}
  button{cursor:pointer;font-size:15px}
  input,select,textarea{
    font-size:15.5px;padding:10px 12px;border:1px solid var(--line-strong);
    border-radius:8px;background:var(--paper-2);color:var(--ink);width:100%;
  }
  textarea{resize:vertical;min-height:62px;line-height:1.45}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
  label{font-size:13.5px;font-weight:700;color:var(--ink-soft);display:block;margin:0 0 5px;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-transform:uppercase;letter-spacing:.04em}
  .btn{
    display:inline-flex;align-items:center;gap:7px;border:1px solid var(--teal-deep);
    background:var(--teal);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;font-size:15px;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    transition:filter .12s;width:auto;
  }
  .btn:hover{filter:brightness(1.07)}
  .btn:active{filter:brightness(.95)}
  .btn.ghost{background:transparent;color:var(--teal-deep);border-color:var(--line-strong)}
  .btn.ghost:hover{background:#0b213608;filter:none}
  .btn.danger{background:var(--clay);border-color:var(--clay-ink)}
  .btn.amber{background:var(--amber);border-color:var(--amber-ink)}
  .btn.blue{background:var(--blue);border-color:var(--blue-ink);color:#fff}
  .btn.sm{padding:6px 12px;font-size:13.5px;border-radius:6px}
  .btn.xs{padding:4px 10px;font-size:12.5px;border-radius:6px}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:12px}
  .card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
  .muted{color:var(--ink-soft);font-size:14.5px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;
    padding:4px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em;
    font-family:ui-sans-serif,system-ui,sans-serif}
  .pill.pending{background:var(--amber-soft);color:var(--amber-ink)}
  .pill.approved{background:var(--green-soft);color:var(--green-ink)}
  .pill.none{background:var(--neutral-soft);color:var(--neutral-ink)}
  .pill.held{background:var(--green-soft);color:var(--green-ink)}
  .pill.missed{background:var(--clay-soft);color:var(--clay-ink)}
  .pill.blue{background:var(--blue-soft);color:var(--blue-ink)}
  .nbadge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;
    padding:0 5px;margin-left:6px;border-radius:9px;background:var(--clay,#c2410c);color:#fff;
    font-size:11px;font-weight:700;line-height:1;vertical-align:middle}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12.5px;text-transform:uppercase;
    letter-spacing:.05em;color:var(--ink-soft);font-weight:700}
  tr:hover td{background:#0b213608}
  .hidden{display:none!important}

  header.app{
    background:var(--ink);color:var(--paper);padding:0 22px;
    display:flex;align-items:center;justify-content:space-between;height:62px;
    border-bottom:3px solid var(--teal);
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand .mark{
    width:36px;height:36px;border-radius:7px;background:var(--teal);
    display:grid;place-items:center;font-weight:700;color:#fff;font-family:ui-sans-serif,sans-serif;
    box-shadow:inset 0 0 0 1px #ffffff22;
  }
  .brand h1{font-size:18px;color:var(--paper)}
  .brand .sub{font-size:11.5px;color:#a9b3bd;font-family:ui-sans-serif,sans-serif;letter-spacing:.05em;text-transform:uppercase}
  .who{display:flex;align-items:center;gap:12px;font-family:ui-sans-serif,sans-serif;font-size:14px}
  .who .role{font-size:11.5px;color:#a9b3bd;text-transform:uppercase;letter-spacing:.05em}

  main{max-width:1180px;margin:0 auto;padding:0 22px 22px}

  /* ---- Notebook divider tabs -------------------------------------------
     Styled like the index tabs of a physical field notebook: raised card
     dividers resting on the rule line. The active tab overlaps the rule so
     it reads as attached to the page, with a teal ink stripe along its top.
     The strip is sticky, so navigation stays in reach on long pages. ----- */
  nav.tabs{
    display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;
    margin:0 0 22px;padding-top:18px;
    position:sticky;top:0;z-index:20;
    /* the notebook rule line, drawn as a background stripe so the active
       tab can sit over it without negative margins */
    background:
      linear-gradient(var(--line-strong),var(--line-strong)) left bottom/100% 2px no-repeat,
      var(--paper);
  }
  nav.tabs button{
    position:relative;border:1px solid var(--line);border-bottom:none;
    background:linear-gradient(#eef1f4,#e5eaef);
    color:var(--ink-soft);font-weight:600;font-size:14.5px;
    font-family:ui-sans-serif,system-ui,sans-serif;
    padding:9px 15px 10px;margin-bottom:2px;border-radius:9px 9px 0 0;
    box-shadow:inset 0 -6px 8px -8px rgba(20,28,38,.22);
    transition:background .15s,color .15s,box-shadow .15s,margin .15s,padding .15s;
  }
  nav.tabs button:hover{background:var(--paper-2);color:var(--ink)}
  nav.tabs button:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
  nav.tabs button.active{
    background:var(--paper-2);color:var(--teal-deep);font-weight:700;
    border-color:var(--line-strong);
    margin-bottom:0;padding-bottom:12px;   /* drops onto the rule and covers it */
    box-shadow:inset 0 3px 0 var(--teal);  /* teal ink stripe along the tab top */
  }

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
  .field{min-width:150px}
  .section-title{display:flex;align-items:center;gap:10px;margin:0 0 14px}
  .section-title h2{font-size:24px}
  .eyebrow{font-family:ui-sans-serif,sans-serif;font-size:12px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:var(--teal-deep);margin-bottom:3px}

  .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;
    background:
      repeating-linear-gradient(transparent,transparent 31px,#0b21360a 31px,#0b21360a 32px),
      var(--paper);
  }
  .auth-card{width:100%;max-width:400px;background:var(--paper-2);border:1px solid var(--line);
    border-radius:14px;padding:30px;box-shadow:var(--shadow);border-top:4px solid var(--teal)}
  .auth-card .mark-lg{width:46px;height:46px;border-radius:10px;background:var(--teal);color:#fff;
    display:grid;place-items:center;font-weight:700;font-size:20px;font-family:ui-sans-serif,sans-serif;margin-bottom:14px}
  .seg{display:flex;background:#0b21360d;border-radius:9px;padding:3px;margin:16px 0;gap:3px}
  .seg button{flex:1;border:none;background:none;padding:8px;border-radius:7px;font-weight:600;
    font-family:ui-sans-serif,sans-serif;color:var(--ink-soft)}
  .seg button.active{background:var(--paper-2);color:var(--teal-deep);box-shadow:var(--shadow)}

  .modal-bg{position:fixed;inset:0;background:rgba(20,28,38,.45);display:grid;place-items:center;padding:18px;z-index:50}
  .modal{background:var(--paper-2);border-radius:14px;max-width:560px;width:100%;padding:24px;
    max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    box-shadow:0 20px 60px -20px rgba(0,0,0,.5);max-height:90vh;overflow:auto}
  .modal.wide{max-width:760px}
  .modal h3{font-size:19px;margin-bottom:14px}

  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120%);
    background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:9px;
    border-left:4px solid var(--teal);
    font-family:ui-sans-serif,sans-serif;font-size:14px;z-index:99;transition:transform .25s;box-shadow:var(--shadow);max-width:90vw}
  #toast.show{transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--clay);border-left-color:var(--clay-ink)}

  /* Keyboard focus is always visible */
  .btn:focus-visible,.seg button:focus-visible,.seg3 button:focus-visible{
    outline:2px solid var(--teal);outline-offset:2px}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  }

  .att-grid{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper-2)}
  .att-grid table{font-size:14px;min-width:640px}
  .att-grid th, .att-grid td{white-space:nowrap}
  .att-cell{cursor:pointer;text-align:center;width:34px;font-weight:700;user-select:none}
  .att-cell.P{background:var(--green-soft);color:var(--green-ink)}
  .att-cell.A{background:var(--clay-soft);color:var(--clay-ink)}
  .att-cell.E{background:var(--amber-soft);color:var(--amber-ink)}
  .att-cell.-{color:#b5bec7}

  .empty{text-align:center;padding:48px 20px;color:var(--ink-soft)}
  .empty .big{font-size:30px;margin-bottom:8px;opacity:.5}
  .stat{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .stat .b{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;min-width:130px}
  .stat .n{font-size:30px;font-weight:700;font-family:ui-sans-serif,sans-serif;color:var(--ink)}
  .stat .l{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-family:ui-sans-serif,sans-serif;font-weight:600}

  /* Weekly meeting log */
  .weeklog{border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
  .weeklog .wrow{display:grid;grid-template-columns:72px 1fr;border-bottom:1px solid var(--line)}
  .weeklog .wrow:last-child{border-bottom:none}
  .weeklog .wk{background:#0b21360d;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:12px 4px;font-family:ui-sans-serif,sans-serif;border-right:1px solid var(--line)}
  .weeklog .wk .num{font-size:22px;font-weight:800;color:var(--ink)}
  .weeklog .wk .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600}
  .weeklog .wbody{padding:13px 14px}
  .weeklog .wmeta{display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:14px;font-family:ui-sans-serif,sans-serif;color:var(--ink)}
  .seg3{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
  .seg3 button{border:none;background:var(--paper-2);padding:7px 13px;font-size:13.5px;font-weight:600;
    font-family:ui-sans-serif,sans-serif;color:var(--ink-soft);border-right:1px solid var(--line)}
  .seg3 button:last-child{border-right:none}
  .seg3 button.on.yes{background:var(--green);color:#fff}
  .seg3 button.on.no{background:var(--clay);color:#fff}
  .seg3 button.on.na{background:var(--ink-soft);color:#fff}
  .wcomment{margin-top:10px}
  .wcomment textarea{min-height:44px;font-size:14.5px}
  .linkpill{font-family:ui-sans-serif,sans-serif;font-size:13px;display:inline-flex;align-items:center;gap:5px;
    background:var(--blue-soft);color:var(--blue-ink);padding:4px 11px;border-radius:99px;text-decoration:none;font-weight:700}

  /* Consultation rows — one card per student */
  .consult-list{display:grid;gap:10px}
  .ccard{display:grid;grid-template-columns:minmax(200px,1.25fr) 138px 1.1fr auto;gap:16px;align-items:center;
    background:var(--paper-2);border:1px solid var(--line);border-left:4px solid var(--teal);
    border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
  .ccard.unset{border-left-color:var(--amber)}
  .cname{font-size:16px}
  .ctime{background:var(--teal-tint);border:1px solid var(--line);border-radius:9px;padding:8px 12px;text-align:center}
  .ccard.unset .ctime{background:var(--amber-soft);border-color:transparent}
  .cday{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--teal-deep)}
  .chrs{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
  .attmini{display:flex;align-items:center;gap:9px;margin-top:7px;font-size:12.5px;color:var(--ink-soft)}
  .attbar{flex:0 0 90px;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
  .attbar .fill{height:100%;background:var(--green);border-radius:99px}
  .attbar .fill.low{background:var(--clay)}
  .cact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .ccard .wktable{grid-column:1/-1}
  .ccard .wktable table{width:100%;border-collapse:collapse}
  .ccard .wktable th{text-align:left;padding:7px 10px;background:#0b213608;border-bottom:1px solid var(--line);
    font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .ccard .wktable td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .ccard .wktable tr:last-child td{border-bottom:none}
  @media (max-width:820px){
    .ccard{grid-template-columns:1fr;gap:9px}
    .ctime{display:flex;gap:10px;align-items:baseline;justify-content:flex-start;text-align:left;width:fit-content;padding:6px 12px}
    .cact{justify-content:flex-start}
  }

  /* Attendance week navigation — one week at a time */
  .weeknav{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .wkstrip{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
  .wksq{width:31px;height:31px;border-radius:7px;border:1px solid var(--line-strong);
    background:var(--paper-2);font:600 12px ui-sans-serif,system-ui,sans-serif;
    color:var(--ink-soft);cursor:pointer;padding:0}
  .wksq.ok{background:var(--green-soft);color:var(--green-ink);border-color:transparent}
  .wksq.miss{background:var(--clay-soft);color:var(--clay-ink);border-color:transparent}
  .wksq.heldsq{background:var(--blue-soft);color:var(--blue-ink);border-color:transparent}
  .wksq.nh{background:var(--line);border-color:transparent}
  .wksq.future{opacity:.4;cursor:default}
  .wksq.sel{outline:2px solid var(--teal);outline-offset:1px}
  .locknote{margin-top:9px;font-size:12.5px;color:var(--amber-ink);background:var(--amber-soft);
    border-radius:7px;padding:7px 11px;display:inline-block}

  /* Attendance student picker — tappable cards */
  .stupick{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
  .stucard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;
    border:1px solid var(--line-strong);background:var(--paper-2);border-radius:9px;
    padding:10px 14px;min-width:158px;cursor:pointer;
    transition:box-shadow .12s,border-color .12s,background .12s}
  .stucard:hover{border-color:var(--teal)}
  .stucard .nm{font-weight:700;font-size:14.5px;font-family:ui-sans-serif,system-ui,sans-serif;color:var(--ink)}
  .stucard .mt{font-size:11.5px;color:var(--ink-soft)}
  .stucard.active{border-color:var(--teal);background:var(--teal-tint);
    box-shadow:inset 0 0 0 1px var(--teal),var(--shadow)}

  /* Week planner (My week) */
  .weekgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
  .daycol{padding:13px}
  .dayhead{font-family:ui-sans-serif,system-ui,sans-serif;font-weight:700;font-size:12.5px;
    text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);
    border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:9px}
  .slot{border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:7px;
    padding:8px 10px;margin-bottom:8px;background:var(--paper)}
  .slot:last-child{margin-bottom:0}
  .slot.consult{border-left-color:var(--blue)}
  .slot-time{font-size:12.5px;font-weight:700;color:var(--ink-soft)}

   "cihe45001" and "cihe 45001" all have to find the same record. Every
   ID comparison goes through this normalised form: case-folded, with
   spaces and hyphens removed. */
const normSid = x => String(x==null?"":x).toLowerCase().replace(/[\s\-]/g,"");

const DB = {
  async getUser(uid){
    if(DEMO){ return mem.users[uid]||null; }
    const s = await getDoc(doc(db,"users",uid)); return s.exists()?s.data():null;
  },
  async setUser(uid,data){ if(DEMO){mem.users[uid]={...mem.users[uid],...data};return;} await setDoc(doc(db,"users",uid),data,{merge:true}); },
  async updateUser(uid,data){ if(DEMO){mem.users[uid]={...mem.users[uid],...data};return;} await updateDoc(doc(db,"users",uid),data); },
  async removeUser(uid){ if(DEMO){ delete mem.users[uid]; return; } await deleteDoc(doc(db,"users",uid)); },
  async findUserByEmail(email){
    if(DEMO){ const e=Object.entries(mem.users).find(([k,v])=>v.email===email); return e?{uid:e[0],...e[1]}:null; }
    const q=query(collection(db,"users"),where("email","==",email)); const r=await getDocs(q);
    return r.empty?null:{uid:r.docs[0].id,...r.docs[0].data()};
  },
  async listUsers(){
    if(DEMO){ return Object.entries(mem.users).map(([id,v])=>({id,...v})); }
    const r=await getDocs(collection(db,"users")); return r.docs.map(d=>({id:d.id,...d.data()}));
  },
  async list(coll, filters={}){
    if(DEMO){
      return Object.entries(mem[coll]||{}).map(([id,v])=>({id,...v}))
        .filter(o=>Object.entries(filters).every(([k,val])=>o[k]===val));
    }
    let qref=collection(db,coll); const fs=Object.entries(filters);
    if(fs.length){ qref=query(qref,...fs.map(([k,v])=>where(k,"==",v))); }
    const r=await getDocs(qref); return r.docs.map(d=>({id:d.id,...d.data()}));
  },
  // Case-insensitive student-ID lookup, used by the student portal sign-in.
  // Firestore's "==" is case-sensitive, so this tries the cheap indexed
  // queries first and only falls back to a scan if they come up empty.
  async findStudentsBySid(sid){
    const want=normSid(sid);
    if(!want) return [];
    if(DEMO){
      return Object.entries(mem.students).map(([id,v])=>({id,...v}))
        .filter(o=>normSid(o.sid)===want);
    }
    const raw=String(sid).trim();
    // 1. exactly as typed — the usual case, one indexed read
    const exact=await getDocs(query(collection(db,"students"),where("sid","==",raw)));
    if(!exact.empty) return exact.docs.map(d=>({id:d.id,...d.data()}));
    // 2. the common capitalisations, in a single "in" query
    const variants=[...new Set([raw.toLowerCase(),raw.toUpperCase(),
      raw.charAt(0).toUpperCase()+raw.slice(1).toLowerCase()])].filter(x=>x&&x!==raw).slice(0,10);
    if(variants.length){
      const r=await getDocs(query(collection(db,"students"),where("sid","in",variants)));
      if(!r.empty) return r.docs.map(d=>({id:d.id,...d.data()}));
    }
    // 3. last resort — compare every record on the normalised form, which
    //    also catches a stray space or hyphen in the stored ID
    try{
      const all=await getDocs(collection(db,"students"));
      return all.docs.map(d=>({id:d.id,...d.data()})).filter(o=>normSid(o.sid)===want);
    }catch(err){ console.warn("student ID scan failed",err); return []; }
  },
  async get(coll,id){
    if(DEMO){ return mem[coll][id]?{id,...mem[coll][id]}:null; }
    const s=await getDoc(doc(db,coll,id)); return s.exists()?{id,...s.data()}:null;
  },
  async add(coll,data){
    if(DEMO){ const id="x"+Math.random().toString(36).slice(2,9); mem[coll][id]={...data}; return id; }
    const r=await addDoc(collection(db,coll),data); return r.id;
  },
  async set(coll,id,data){
    if(DEMO){ mem[coll][id]={...mem[coll][id],...data}; return; }
    await setDoc(doc(db,coll,id),data,{merge:true});
  },
  async update(coll,id,data){
    if(DEMO){ mem[coll][id]={...mem[coll][id],...data}; return; }
    await updateDoc(doc(db,coll,id),data);
  },
  // Update ONE week inside a consultation's `weeks` map using Firestore's
  // nested field-path syntax. This rewrites only that single key (never the
  // whole map), which avoids stale-merge / cache issues that made per-week
  // time changes appear not to save. weekData fully replaces that week.
  async updateWeek(consId, weekKey, weekData){
    const key=String(weekKey);
    if(DEMO){
      const c=mem.consultations[consId]||{};
      const weeks={...(c.weeks||{})};
      weeks[key]=weekData;
      mem.consultations[consId]={...c, weeks};
      return;
    }
    const ref=doc(db,"consultations",consId);
    try{
      await updateDoc(ref, { ["weeks."+key]: weekData });
    }catch(err){
      // updateDoc fails if the doc/field is missing; setDoc+merge with a nested
      // object writes (and creates) just this week without touching siblings.
      await setDoc(ref, { weeks: { [key]: weekData } }, { merge:true });
    }
  },
  // Read a single consultation fresh from the server (bypasses list caching).
  async getConsultation(id){
    if(DEMO){ return mem.consultations[id]?{id,...mem.consultations[id]}:null; }
    const s=await getDoc(doc(db,"consultations",id));
    return s.exists()?{id,...s.data()}:null;
  },
  async remove(coll,id){ if(DEMO){ delete mem[coll][id]; return; } await deleteDoc(doc(db,coll,id)); }
};

   embedded webviews, in which case the toggle still works for the session). */
function themePref(){ try{ return window.localStorage.getItem("sh-theme"); }catch(e){ return null; } }
function themeSave(t){ try{ window.localStorage.setItem("sh-theme",t); }catch(e){} }

/* ---- Mobile tables ----
   Copies each column header onto its cells (data-label) and tags the table
   `resp`, letting the phone stylesheet stack every row into a label/value
   card. Runs automatically for every table any view renders — no per-view
   work needed. Desktop and print layouts are untouched. */
function labelTable(t){
  const heads=[...t.querySelectorAll("thead th")].map(th=>th.textContent.trim());
  if(!heads.length) return;
  t.querySelectorAll("tbody tr").forEach(tr=>{
    [...tr.children].forEach((td,i)=>td.setAttribute("data-label",heads[i]??""));
  });
  t.classList.add("resp");
}
new MutationObserver(muts=>{
  for(const m of muts) for(const n of m.addedNodes){
    if(n.nodeType!==1) continue;
    if(n.tagName==="TABLE") labelTable(n);
    else n.querySelectorAll?.("table").forEach(labelTable);
  }
}).observe(document.documentElement,{childList:true,subtree:true});

/* ---- CoC assessment panels -------------------------------------------
   Confirmation of Candidature is assessed by a small panel that has to be
   INDEPENDENT of the student's supervision team. Two rules fall out of that
   and are enforced everywhere below:
     1. when a supervisor nominates names, they can't put forward themselves
        or anyone who supervises one of their own students;
     2. a student's own principal / co can never be seated on that student's
        panel, however the coordinator gets there.
   Numbers are policy, not structure \u2014 change them here and every prompt,
   warning and progress count in the UI follows. -------------------------- */
const PANEL_TARGET=6;   // the most we need from any one supervisor
const PANEL_MIN=4;      // we ask for MORE THAN THREE, so four is the floor
const PANEL_SIZE=3;     // members seated on each student's panel
const PANEL_CAP=6;      // students one assessor is normally asked to take

const nomId=()=>"n"+Math.random().toString(36).slice(2,9);
/* Firestore rejects any field whose value is `undefined` \u2014 it is not the
   same as an absent key. An EXTERNAL assessor has no uid at all, so copying
   a member field-by-field with `uid:m.uid` writes undefined and the whole
   save fails. Every member record therefore goes through here, which fills
   the text fields and only sets uid when there genuinely is one. */
function cleanMember(m){
  const kind=m?.kind==="external"?"external":"internal";
  const out={
    id:m?.id||nomId(), kind,
    name:m?.name||"", email:m?.email||"", mobile:m?.mobile||"",
    org:m?.org||(kind==="external"?"External":"Internal")
  };
  if(kind==="internal"&&m?.uid) out.uid=m.uid;
  return out;
}
const emailKey=x=>String(x||"").trim().toLowerCase();
const membersOf=p=>Array.isArray(p?.members)?p.members:[];
const poolOf=(pools,uid)=>pools.find(p=>p.supervisorUid===uid)||null;
/* One identity for a nominee however they were entered, so the same person
   suggested by three supervisors collapses into one candidate with one
   workload count. Staff key off their uid; external people off their email. */
const memberKey=m=>m.kind==="internal"&&m.uid?("u:"+m.uid):("e:"+emailKey(m.email||m.name));

// Rule 1: everyone this supervisor may NOT nominate.
function conflictedUidsFor(supUid,students){
  const out=new Set([supUid]);
  students.filter(s=>s.principalUid===supUid||s.coUid===supUid).forEach(s=>{
    if(s.principalUid) out.add(s.principalUid);
    if(s.coUid) out.add(s.coUid);
  });
  return out;
}

/* Everyone carrying more than PANEL_CAP students, across every panel.
   `pending` lets a picker ask "what would the load be if I saved this?"
   rather than only reporting damage after the fact. */
function overloadedMembers(groups,pending){
  const load=groupLoad(groups,pending?.skipGroupId);
  (pending?.members||[]).forEach(m=>
    load.set(memberKey(m),(load.get(memberKey(m))||0)+(pending.studentCount||0)));
  const out=[];
  load.forEach((n,k)=>{ if(n>PANEL_CAP) out.push({key:k,n}); });
  const name=k=>{
    for(const g of groups) for(const m of groupMembers(g)) if(memberKey(m)===k) return m.name;
    for(const m of (pending?.members||[])) if(memberKey(m)===k) return m.name;
    return k;
  };
  return out.map(x=>({...x,name:name(x.key)})).sort((a,b)=>b.n-a.n);
}

/* ============================================================
   13B. PANEL GROUPS — the scheduling unit
   ------------------------------------------------------------
   A panel is now a GROUP: PANEL_SIZE assessors who between them take up to
   PANEL_CAP students. That is the unit availability and timetabling hang
   off — asking three people to agree a half-day once is the whole point,
   and you cannot do that if the panel is defined one student at a time.

   panelGroups/{id} -> {
     semesterId, label, updatedAt,
     members: [ {id,kind,uid?,name,email,mobile,org} ],
     chairKey,                       // availKey() of the member chairing
     studentIds: [ studentDocId ],    // up to PANEL_CAP
     sessions: [ {id,date,start,end} ],          // half-days the admin proposes
     availability: { [availKey]: { [sessionId]: true|false } },
     chosenSessionId,                            // the agreed half-day
     slotMins,                                   // presentation length
     slots: [ {start,end,studentDocId} ]         // generated timetable
   }

   The independence rule now reads across the whole group: a member may not
   assess ANY student in it, so adding a student and adding a member both
   have to check the other side.
   ============================================================ */
const PANEL_SLOT_MINS=30;    // default presentation length
const PANEL_BUFFER_MINS=30;  // tail kept for panel discussion

/* Firestore map keys can't hold arbitrary punctuation safely, and memberKey
   carries an email. Flatten it for use as a key inside `availability`. */
const availKey=m=>memberKey(m).replace(/[^a-zA-Z0-9]/g,"_");

/* An assessor's discipline comes from their staff profile; an external's is
   unknown, so they simply don't narrow the area. A panel of two IT staff and
   one external is an IT panel. */
const memberArea=m=>m.kind==="internal"&&m.uid
  ? (S.supervisors.find(u=>u.id===m.uid)?.area||"") : "";
const panelAreas=members=>[...new Set((members||[]).map(memberArea).filter(Boolean))];

/* Which discipline to show first in the student picker. The supervisor whose
   students we came here to seat wins outright; otherwise take the assessors'
   majority. A genuinely split panel (one IT, one Business) gets no default at
   all rather than an arbitrary one. */
function defaultArea(members,focusUid){
  if(focusUid){
    const a=S.supervisors.find(u=>u.id===focusUid)?.area;
    if(a) return a;
  }
  const counts={};
  (members||[]).forEach(m=>{ const a=memberArea(m); if(a) counts[a]=(counts[a]||0)+1; });
  const ranked=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if(!ranked.length) return "";
  if(ranked.length>1&&ranked[0][1]===ranked[1][1]) return "";
  return ranked[0][0];
}

const groupsWithStudent=(groups,sid)=>groups.filter(g=>(g.studentIds||[]).includes(sid));
const groupOfStudent=(groups,sid)=>groupsWithStudent(groups,sid)[0]||null;
const groupMembers=g=>Array.isArray(g?.members)?g.members:[];
const groupStudents=g=>Array.isArray(g?.studentIds)?g.studentIds:[];
const groupSessions=g=>Array.isArray(g?.sessions)?g.sessions:[];
const isChair=(g,m)=>g?.chairKey===availKey(m);

/* Workload is now counted in students-per-assessor across every group. */
function groupLoad(groups,skipGroupId){
  const load=new Map();
  groups.filter(g=>g.id!==skipGroupId).forEach(g=>{
    const n=groupStudents(g).length;
    groupMembers(g).forEach(m=>load.set(memberKey(m),(load.get(memberKey(m))||0)+n));
  });
  return load;
}

/* Everyone in `members` who supervises any student in `studentIds`. Returned
   as a list of {member,student} so the UI can say WHICH clash it found
   rather than just refusing. */
function groupClashes(members,studentIds,students){
  const out=[];
  members.forEach(m=>{
    if(m.kind!=="internal"||!m.uid) return;
    studentIds.forEach(sid=>{
      const s=students.find(x=>x.id===sid); if(!s) return;
      if(s.principalUid===m.uid||s.coUid===m.uid) out.push({m,s});
    });
  });
  return out;
}

const availOf=(g,m,sessionId)=>g?.availability?.[availKey(m)]?.[sessionId];
/* A session works only when EVERY member has actively said yes. An unanswered
   member is not a yes — silence must not schedule someone. */
const sessionWorks=(g,sess)=>groupMembers(g).length>0
  && groupMembers(g).every(m=>availOf(g,m,sess.id)===true);
const commonSessions=g=>groupSessions(g).filter(s=>sessionWorks(g,s));
function availCounts(g,sess){
  const ms=groupMembers(g);
  return {yes:ms.filter(m=>availOf(g,m,sess.id)===true).length,
          no:ms.filter(m=>availOf(g,m,sess.id)===false).length,
          pending:ms.filter(m=>availOf(g,m,sess.id)===undefined).length,
          total:ms.length};
}

const pad2=n=>String(n).padStart(2,"0");
const minsOf=t=>{const[a,b]=String(t||"0:0").split(":").map(Number);return (a||0)*60+(b||0);};
const hhmm=m=>pad2(Math.floor(m/60))+":"+pad2(m%60);
function prettyTime(t){
  const m=minsOf(t), h=Math.floor(m/60), mm=m%60;
  const ap=h<12?"am":"pm", h12=h%12===0?12:h%12;
  return h12+(mm?":"+pad2(mm):"")+" "+ap;
}
function prettyDate(d){
  if(!d) return "date not set";
  const dt=new Date(d+"T00:00:00");
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
}
const sessionLabel=s=>prettyDate(s?.date)+", "+prettyTime(s?.start)+"–"+prettyTime(s?.end);
const sessionMins=s=>Math.max(0,minsOf(s?.end)-minsOf(s?.start));

/* Lay the students out back to back from the session start, keeping a buffer
   at the end for the panel's own discussion. Returns the slots plus what had
   to be left out, so the caller can say so instead of silently truncating. */
function buildSlots(session,studentIds,slotMins){
  const per=Math.max(5,slotMins||PANEL_SLOT_MINS);
  const total=sessionMins(session);
  const usable=Math.max(0,total-PANEL_BUFFER_MINS);
  const fits=Math.floor(usable/per);
  const slots=[]; let t=minsOf(session.start);
  studentIds.slice(0,fits).forEach(sid=>{
    slots.push({start:hhmm(t),end:hhmm(t+per),studentDocId:sid}); t+=per;
  });
  return {slots,unplaced:studentIds.slice(fits),
          bufferStart:hhmm(t),bufferEnd:session.end,capacity:fits};
}

/* Write ONLY the availability map. saveGroup() rewrites every field, which
   normalises the record along the way — it fills in memberUids, stamps
   `direct` onto sessions and so on. On a group saved before those fields
   existed that turns a one-key change into a many-key change, and the
   security rule (which lets an assessor touch availability and nothing else)
   correctly refuses it. A supervisor ticking a box must therefore write
   exactly two fields and no more. */
async function saveAvailability(groupId,availability){
  await DB.update("panelGroups",groupId,{availability,updatedAt:Date.now()});
}

async function saveGroup(g){
  const members=(g.members||[]).map(cleanMember);
  const rec={
    semesterId:S.activeSem, label:g.label||"Panel",
    members,
    /* Flat list of the internal assessors' uids. Firestore rules cannot look
       inside a list of maps, so without this there is no way to express
       "this signed-in user is on this panel" \u2014 which is what lets a member
       record their own availability while everything else stays admin-only. */
    memberUids:members.filter(m=>m.kind==="internal"&&m.uid).map(m=>m.uid),
    chairKey:g.chairKey||"",
    studentIds:(g.studentIds||[]).filter(Boolean),
    sessions:(g.sessions||[]).map(s=>({id:s.id||nomId(),date:s.date||"",
                                       start:s.start||"",end:s.end||"",
                                       direct:!!s.direct})),   // direct = set by admin, not polled
    availability:g.availability||{},
    chosenSessionId:g.chosenSessionId||"",
    slotMins:g.slotMins||PANEL_SLOT_MINS,
    slots:(g.slots||[]).map(s=>({start:s.start||"",end:s.end||"",
                                 studentDocId:s.studentDocId||""})),
    updatedAt:Date.now()
  };
  if(g.id){ await DB.update("panelGroups",g.id,rec); return g.id; }
  return await DB.add("panelGroups",rec);   // caller may want to jump straight in
}

/* One row per student, flattened across panel + schedule + consultation, in
   principal-supervisor order. Both the on-screen export table and the CSV are
   built from this, so they can never drift apart. */
function exportRows(students,groups,cons){
  return students.map(s=>{
    const g=groupOfStudent(groups,s.id);
    const sess=g?groupSessions(g).find(x=>x.id===g.chosenSessionId):null;
    const slot=g?(g.slots||[]).find(x=>x.studentDocId===s.id):null;
    const c=cons.find(x=>x.studentDocId===s.id);
    const ms=groupMembers(g);
    return {
      s, g, sess, slot, c, members:ms,
      principal:s.principalName||supName(s.principalUid),
      chair:ms.find(m=>isChair(g,m))||null,
      /* Recomputed live rather than stored, so it can never go stale after a
         supervisor changes or a student moves panel. */
      notIndependent:g?groupClashes(ms,[s.id],students).map(x=>x.m.name):[],
      cocDate:sess?prettyDate(sess.date):"",
      cocTime:slot?(prettyTime(slot.start)+"–"+prettyTime(slot.end)):"",
      consult:(c&&c.day)?(c.day+" "+c.start+"–"+c.end):""
    };
  }).sort((a,b)=>String(a.principal).localeCompare(String(b.principal))
    ||String(a.s.name).localeCompare(String(b.s.name)));
}

function downloadPanelCSV(rows,sem){
  const head=["principal_supervisor","student","student_id","campus","area","co_supervisor",
    "consultation_time","panel","panel_chair",
    "member_1","member_1_email","member_1_mobile","member_1_type",
    "member_2","member_2_email","member_2_mobile","member_2_type",
    "member_3","member_3_email","member_3_mobile","member_3_type",
    "coc_date","coc_start","coc_end","independence"];
  const lines=[head.join(",")];
  rows.forEach(r=>{
    const m=[0,1,2].map(i=>r.members[i]||{});
    const cell=[r.principal,r.s.name,r.s.sid||"",r.s.campus||"",r.s.area||"",r.s.coName||"",
      r.consult, r.g?.label||"", r.chair?.name||"",
      ...m.flatMap(x=>[x.name||"",x.email||"",x.mobile||"",
                       x.kind?(x.kind==="internal"?"internal":"external"):""]),
      r.sess?.date||"", r.slot?r.slot.start:"", r.slot?r.slot.end:"",
      r.notIndependent.length?("override: supervised by "+r.notIndependent.join(", ")):"ok"];
    lines.push(cell.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(","));
  });
  const blob=new Blob([lines.join("\n")],{type:"text/csv"});
  const fname=`coc_panels_${(sem?.label||"export").replace(/\s+/g,"_")}.csv`;
  const a=el("a",{href:URL.createObjectURL(blob),download:fname});
  document.body.append(a); a.click(); a.remove();
  toast("Panel export downloaded.");
}

/* Same failure mode as the Messages tab: the CoC screens live in collections
   that older rules files don't mention, so every read is denied and the tab
   renders as a bare heading. Say so, and hand over the rules to paste. */
function panelRuleHelp(err){
  const card=el("div",{class:"card",style:"border-left:4px solid var(--clay,#c2410c)"});
  card.append(
    el("h3",{style:"margin:0 0 6px"},"CoC panels can't be loaded"),
    el("p",{class:"muted",style:"margin:0 0 10px"},
      "The app couldn't read the CoC collections. Firestore reported: "+(err?.message||"unknown error")),
    el("p",{style:"margin:0 0 8px;font-size:14px"},
      "Nominations, panels and schedules live in three collections. Anything your security rules don't mention is denied outright, so this tab comes back empty. Add these under Firestore Database \u2192 Rules, then reload:"));
  const rule=
"match /panelPool/{id} {\n  allow read, write: if request.auth != null;\n}\n"+
"match /panels/{id} {\n  allow read, write: if request.auth != null;\n}\n"+
"match /panelGroups/{id} {\n  allow read, write: if request.auth != null;\n}";
  card.append(
    el("pre",{style:"white-space:pre-wrap;background:rgba(127,127,127,.1);padding:12px;border-radius:8px;font-size:12.5px;margin:0 0 10px"},rule),
    el("div",{class:"row",style:"gap:8px;flex-wrap:wrap"},
      el("button",{class:"btn sm",onclick:()=>{
        navigator.clipboard?.writeText(rule).then(()=>toast("Rules copied."),()=>toast("Copy failed \u2014 select the text manually.",true));
      }},"Copy rules"),
      el("button",{class:"btn ghost sm",onclick:()=>drawMain()},"Retry")),
    el("p",{class:"muted ui",style:"margin:10px 0 0;font-size:12.5px"},
      "That is the permissive version, matching how the rest of the app is secured \u2014 use it to confirm the tab works. The tighter rules are in the firestore.rules file supplied with this app."));
  return card;
}

/* ============================================================
   13C. CoC PANEL — SUPERVISOR VIEW
   Three jobs: put names forward, answer the availability request when the
   coordinator asks, and see the result for your own students.
   ============================================================ */
async function viewPanels(v){
  v.innerHTML="";
  v.append(el("div",{class:"section-title"},el("div",{},
    el("div",{class:"eyebrow ui"},"Confirmation of Candidature"),
    el("h2",{},"CoC panel"))));

  const bar=el("div",{class:"toolbar"}); bar.append(semesterPicker(()=>viewPanels(v)));
  v.append(bar);
  if(!S.activeSem){ v.append(emptyState("No semester selected","Ask the coordinator to set one up first.")); return; }

  let students,pools,groups;
  try{
    students=await DB.list("students",{semesterId:S.activeSem});
    /* Only ever ask for MY OWN nomination doc, never the whole semester's.
       Firestore rejects a list query outright unless the query itself is
       narrow enough to guarantee every document it could return is allowed
       \u2014 so the security rule and this filter have to agree. */
    pools=await DB.list("panelPool",{semesterId:S.activeSem,supervisorUid:S.uid});
    groups=await DB.list("panelGroups",{semesterId:S.activeSem});
  }catch(err){ v.append(panelRuleHelp(err)); return; }

  const mine=students.filter(s=>s.principalUid===S.uid||s.coUid===S.uid);
  let members=membersOf(poolOf(pools,S.uid)).slice();
  const host=el("div",{}); v.append(host);

  const eligibleStaff=()=>{
    const blocked=conflictedUidsFor(S.uid,students);
    const taken=new Set(members.filter(m=>m.kind==="internal").map(m=>m.uid));
    return S.supervisors.filter(u=>!blocked.has(u.id)&&!taken.has(u.id))
      .sort((a,b)=>String(a.name||a.email).localeCompare(String(b.name||b.email)));
  };
  async function commit(msg){
    try{
      await savePool(S.uid,S.userName||S.user?.email||"",S.user?.email||"",members);
      groups=await DB.list("panelGroups",{semesterId:S.activeSem});
    }catch(err){
      members=membersOf(poolOf(pools,S.uid)).slice();
      toast(err?.message||"Could not save \u2014 check your connection or permissions.",true);
      draw(); return;
    }
    toast(msg||"Nominations saved."); draw();
  }
  async function reload(){
    try{ groups=await DB.list("panelGroups",{semesterId:S.activeSem}); }
    catch(err){ toast(err?.message||"Could not reload.",true); return; }
    draw();
  }

  function draw(){
    host.innerHTML="";
    drawSummary();
    drawAvailability();
    drawNominations();
    drawMyStudents();
    drawAssessing();
  }

  /* Three tiles answering the only questions a supervisor opens this tab
     with: have I done my bit, is anything waiting on me, and when are my
     students on. Everything below is the detail behind these. */
  function drawSummary(){
    const asMember=groups.filter(g=>groupMembers(g).some(m=>m.kind==="internal"&&m.uid===S.uid));
    const pending=asMember.filter(g=>{
      const me=groupMembers(g).find(m=>m.kind==="internal"&&m.uid===S.uid);
      return groupSessions(g).some(x=>availOf(g,me,x.id)===undefined);
    }).length;
    const scheduled=mine.filter(x=>{
      const g=groupOfStudent(groups,x.id);
      return g&&g.chosenSessionId&&(g.slots||[]).some(sl=>sl.studentDocId===x.id);
    }).length;
    host.append(el("div",{class:"stat"},
      statBox(members.length+" / "+PANEL_TARGET,"Names nominated"),
      statBox(pending,"Availability to answer"),
      statBox(scheduled+" / "+mine.length,"My students scheduled"),
      statBox(asMember.reduce((n,g)=>n+groupStudents(g).length,0),"Students I assess")));
  }

  /* ---- the availability request, first because it's time-critical ---- */
  function drawAvailability(){
    const asMember=groups.filter(g=>groupMembers(g).some(m=>m.kind==="internal"&&m.uid===S.uid)
                                    && groupSessions(g).length);
    if(!asMember.length) return;
    host.append(sectionHead("\u2713","When can you assess?",
      "Tick the half-days you could attend. A session is only usable if every assessor says yes.","act"));
    const pending=asMember.filter(g=>{
      const me=groupMembers(g).find(m=>m.kind==="internal"&&m.uid===S.uid);
      return groupSessions(g).some(s=>availOf(g,me,s.id)===undefined);
    });
    if(pending.length) host.append(noticeBar("amber",
      "The coordinator needs your availability for "+pending.length+
      (pending.length===1?" panel":" panels")+". Tick each half-day you could attend \u2014 a session is only usable if all "+PANEL_SIZE+" of you say yes."));

    asMember.forEach(g=>{
      const me=groupMembers(g).find(m=>m.kind==="internal"&&m.uid===S.uid);
      const stu=groupStudents(g).map(id=>students.find(x=>x.id===id)).filter(Boolean);
      const chosen=groupSessions(g).find(s=>s.id===g.chosenSessionId);
      const c=cardShell("My availability \u00B7 "+(g.label||"Panel"),
        isChair(g,me)?el("span",{class:"pill blue"},"You chair this panel"):el("span",{class:"muted ui"},stu.length+" students"),
        chosen?"ok":"act");
      const body=el("div",{style:"padding:14px 16px"});

      if(chosen){
        body.append(noticeBar("green","Confirmed for "+sessionLabel(chosen)+
          ". Your slots are listed under \u201CStudents I'm assessing\u201D below."));
      }
      const t=el("table",{});
      t.append(el("thead",{},el("tr",{},...["Proposed session","Panel so far","Me"].map(h=>el("th",{},h)))));
      const tb=el("tbody",{});
      groupSessions(g).forEach(s=>{
        const cnt=availCounts(g,s);
        const mine_=availOf(g,me,s.id);
        const btns=el("div",{class:"row",style:"gap:5px"});
        const mk=(label,val,cls)=>el("button",{
          class:"btn xs "+(mine_===val?cls:"ghost"),
          onclick:async()=>{
            const av=JSON.parse(JSON.stringify(g.availability||{}));
            (av[availKey(me)]=av[availKey(me)]||{})[s.id]=val;
            try{ await saveAvailability(g.id,av); }
            catch(err){ toast(err?.message||"Could not save.",true); return; }
            toast("Availability saved."); reload();
          }},label);
        btns.append(mk("Available",true,"green"),mk("Can't make it",false,"clay"));
        tb.append(el("tr",{},
          el("td",{},el("strong",{},sessionLabel(s))),
          el("td",{class:"muted ui",style:"font-size:13px"},
            cnt.yes+" of "+cnt.total+" available"+(cnt.pending?", "+cnt.pending+" yet to answer":"")+
            (sessionWorks(g,s)?" \u2014 works for everyone":"")),
          el("td",{},btns)));
      });
      t.append(tb); body.append(t);
      c.append(body); host.append(c);
    });
  }

  /* ---- nominations ---- */
  function drawNominations(){
    const n=members.length;
    host.append(sectionHead("\u270E","Who could assess your students?",
      "Put forward more than three names, up to "+PANEL_TARGET+
      ". The coordinator seats a "+PANEL_SIZE+"-member panel from everyone's suggestions.",
      n>=PANEL_MIN?"done":"act"));
    if(!mine.length) host.append(noticeBar("blue",
      "You have no students this semester, so there's nothing to nominate for yet. Names you put forward still stay on file for the coordinator."));
    if(n===0) host.append(noticeBar("amber",
      "You haven't nominated anyone yet. Please put forward more than three names \u2014 up to "+PANEL_TARGET+" \u2014 so the coordinator can seat a "+PANEL_SIZE+
      "-member panel without a clash."));
    else if(n<PANEL_MIN) host.append(noticeBar("amber",
      n+(n===1?" name":" names")+" so far. We ask for more than three, so please add at least "+(PANEL_MIN-n)+
      " more. Up to "+PANEL_TARGET+" is welcome \u2014 spare names are what let the coordinator avoid clashes and spread the load."));
    else if(n<PANEL_TARGET) host.append(noticeBar("blue",
      n+" names nominated \u2014 that clears the minimum. You can put forward up to "+PANEL_TARGET+
      ", and another "+(PANEL_TARGET-n)+" would give the coordinator more room."));
    else if(n===PANEL_TARGET) host.append(noticeBar("green",
      "All "+PANEL_TARGET+" names nominated \u2014 that's the full set. Thank you."));
    else host.append(noticeBar("blue",
      n+" names nominated. Only "+PANEL_TARGET+" are needed, so the extras will simply sit in reserve."));

    const load=groupLoad(groups);
    const card=cardShell("My nominated assessors",el("span",{class:n>=PANEL_MIN?"pill approved":"pill pending"},
        n+" of "+PANEL_TARGET+" suggested"), n>=PANEL_MIN?"ok":"act");
    const body=el("div",{style:"padding:14px 16px"});
    if(!n) body.append(el("p",{class:"muted",style:"margin:0 0 12px"},
      "No names yet. Add colleagues from the hub, or type in an external assessor."));
    else{
      const list=el("div",{class:"pgrid",style:"margin-bottom:12px"});
      members.forEach(m=>{
        const acts=el("div",{class:"row",style:"gap:5px"});
        acts.append(loadPill(load.get(memberKey(m))||0));
        acts.append(emailButton(m.email,"MRes Confirmation of Candidature","Dear "+(m.name||"")+",\n\n","\u2709","btn xs ghost"));
        if(m.kind==="external") acts.append(el("button",{class:"btn xs ghost",onclick:()=>nominateExternal(m,upd=>{
          members=members.map(x=>x.id===m.id?upd:x); commit("Nominee updated.");
        })},"Edit"));
        acts.append(el("button",{class:"btn xs ghost",onclick:()=>{
          members=members.filter(x=>x.id!==m.id); commit("Nominee removed.");
        }},"Remove"));
        list.append(memberLine(m,acts));
      });
      body.append(list);
    }
    body.append(el("div",{class:"row"},
      el("button",{class:"btn sm",onclick:()=>nominateInternal(eligibleStaff(),m=>{
        members=members.concat([m]); commit("Nominee added.");
      })},"+ Nominate a colleague"),
      el("button",{class:"btn ghost sm",onclick:()=>nominateExternal(null,m=>{
        members=members.concat([m]); commit("Nominee added.");
      })},"+ Nominate an external assessor")));
    card.append(body); host.append(card);
  }

  /* ---- my students' panels and their CoC time ---- */
  function drawMyStudents(){
    if(!mine.length) return;
    host.append(sectionHead("\u25CE","Your students' CoC",
      "Who is assessing them, and when they present. Set by the coordinator.","info"));
    const c=cardShell("My students' CoC",null,"info");
    const t=el("table",{});
    t.append(el("thead",{},el("tr",{},...["Student","ID","My role","Panel","Chair","CoC time"].map(h=>el("th",{},h)))));
    const tb=el("tbody",{});
    mine.sort((a,b)=>String(a.name).localeCompare(String(b.name))).forEach(s=>{
      const g=groupOfStudent(groups,s.id), ms=groupMembers(g);
      const chips=el("div",{class:"row",style:"gap:5px"});
      if(!ms.length) chips.append(el("span",{class:"pill pending"},"No panel yet"));
      else ms.forEach(m=>chips.append(seatChip(m)));
      const sess=g?groupSessions(g).find(x=>x.id===g.chosenSessionId):null;
      const slot=g?(g.slots||[]).find(x=>x.studentDocId===s.id):null;
      const when=sess&&slot
        ? el("strong",{},prettyDate(sess.date)+", "+prettyTime(slot.start)+"–"+prettyTime(slot.end))
        : sess?el("span",{class:"pill pending"},"Session set, slot pending")
             :el("span",{class:"pill pending"},"Not scheduled");
      const chair=ms.find(m=>isChair(g,m));
      tb.append(el("tr",{},
        el("td",{},el("strong",{},s.name)),
        el("td",{class:"muted"},s.sid||"\u2014"),
        el("td",{},s.principalUid===S.uid?el("span",{class:"pill blue"},"Principal"):el("span",{class:"pill none"},"Co-supervisor")),
        el("td",{},chips),
        el("td",{class:"muted"},chair?chair.name:"\u2014"),
        el("td",{},when)));
    });
    t.append(tb); c.append(t); host.append(c);
  }

  /* ---- what I've been asked to assess ---- */
  function drawAssessing(){
    const asMember=groups.filter(g=>groupMembers(g).some(m=>m.kind==="internal"&&m.uid===S.uid));
    const total=asMember.reduce((n,g)=>n+groupStudents(g).length,0);
    host.append(sectionHead("\u2637","Students you're assessing",
      "CoCs you have been asked to sit on, and your slot times.",
      total>PANEL_CAP?"act":""));
    const c=cardShell("Students I'm assessing",
      el("span",{class:total>PANEL_CAP?"pill missed":"muted ui"},total+" of "+PANEL_CAP+" usual maximum"),
      total>PANEL_CAP?"act":"main");
    if(!asMember.length){
      c.append(el("p",{class:"muted",style:"padding:16px;margin:0"},"You haven't been put on any CoC panel this semester."));
      host.append(c); return;
    }
    const t=el("table",{});
    t.append(el("thead",{},el("tr",{},...["Student","ID","Principal","Panel","My role","Time"].map(h=>el("th",{},h)))));
    const tb=el("tbody",{});
    asMember.forEach(g=>{
      const me=groupMembers(g).find(m=>m.kind==="internal"&&m.uid===S.uid);
      const sess=groupSessions(g).find(x=>x.id===g.chosenSessionId);
      groupStudents(g).forEach(id=>{
        const s=students.find(x=>x.id===id); if(!s) return;
        const slot=(g.slots||[]).find(x=>x.studentDocId===id);
        tb.append(el("tr",{},
          el("td",{},el("strong",{},s.name)),
          el("td",{class:"muted"},s.sid||"\u2014"),
          el("td",{class:"muted"},s.principalName||"\u2014"),
          el("td",{class:"muted"},g.label||"Panel"),
          el("td",{},isChair(g,me)?el("span",{class:"pill blue"},"Chair"):el("span",{class:"pill none"},"Member")),
          el("td",{},sess&&slot?el("strong",{},prettyDate(sess.date)+", "+prettyTime(slot.start)+"–"+prettyTime(slot.end))
                               :el("span",{class:"pill pending"},"Not scheduled"))));
      });
    });
    t.append(tb); c.append(t);
    if(total>PANEL_CAP) c.append(el("div",{class:"locknote",style:"margin:0;border-radius:0"},
      "That's above the usual limit of "+PANEL_CAP+" \u2014 let the coordinator know if it's too much."));
    host.append(c);
  }

  draw();
}

    cons=await DB.list("consultations",{semesterId:S.activeSem});
  }catch(err){ v.append(panelRuleHelp(err)); return; }
  /* The legacy per-student panels are only read to offer the one-off
     conversion. A site that never had them \u2014 or that has already dropped
     the collection from its rules \u2014 should not lose the whole screen over
     it, so this read fails quietly on its own. */
  try{ legacy=await DB.list("panels",{semesterId:S.activeSem}); }
  catch(err){ legacy=[]; }

  async function reload(){
    try{
      students=await DB.list("students",{semesterId:S.activeSem});
      pools=await DB.list("panelPool",{semesterId:S.activeSem});
      groups=await DB.list("panelGroups",{semesterId:S.activeSem});
    }catch(err){ toast(err?.message||"Could not reload panels.",true); return; }
    try{ legacy=await DB.list("panels",{semesterId:S.activeSem}); }catch(err){ legacy=[]; }
    draw();
  }

  if(!S.panelTab) S.panelTab="panels";
  const tabs=el("div",{class:"subtabs ui"});
  [["nominations","Nominations"],["panels","Panels & scheduling"],["export","Export"]].forEach(([id,label])=>{
    const b=el("button",{class:S.panelTab===id?"active":"",onclick:()=>{
      S.panelTab=id; [...tabs.children].forEach(x=>x.classList.toggle("active",x===b)); draw();
    }},label);
    tabs.append(b);
  });
  v.append(tabs);
  const host=el("div",{}); v.append(host);

  function candidatePool(){
    const byKey=new Map();
    pools.forEach(pl=>membersOf(pl).forEach(m=>{
      const k=memberKey(m);
      if(!byKey.has(k)) byKey.set(k,{...m,nominators:[]});
      const rec=byKey.get(k);
      if(!rec.nominators.includes(pl.supervisorUid)) rec.nominators.push(pl.supervisorUid);
      if(!rec.mobile&&m.mobile) rec.mobile=m.mobile;
      if(!rec.email&&m.email) rec.email=m.email;
    }));
    return [...byKey.values()];
  }

  function draw(){
    host.innerHTML="";
    const placed=new Set(groups.flatMap(groupStudents));
    const scheduled=groups.filter(g=>g.chosenSessionId&&(g.slots||[]).length).length;
    host.append(el("div",{class:"stat"},
      statBox(students.length,"Students"),
      statBox(placed.size,"On a panel"),
      statBox(students.length-placed.size,"Unassigned"),
      statBox(groups.length,"Panels"),
      statBox(scheduled,"Scheduled")));
    if(S.panelTab==="nominations") drawNominations();
    else if(S.panelTab==="export") drawExport();
    else drawPanels(placed);
  }

  // ================================================== NOMINATIONS
  function drawNominations(){
    host.append(sectionHead("\u2709","Chase and read the nominations",
      "Every supervisor is asked for more than three names, up to "+PANEL_TARGET+
      ". Create a panel straight from anyone's list.","act"));
    const principals=[...new Set(students.map(s=>s.principalUid).filter(Boolean))];
    const short=principals.filter(uid=>membersOf(poolOf(pools,uid)).length<PANEL_MIN);
    if(short.length) host.append(noticeBar("amber",
      short.length+(short.length===1?" principal supervisor has":" principal supervisors have")+
      " put forward three names or fewer: "+short.map(uid=>supName(uid)).join(", ")+
      ". We ask for more than three, up to "+PANEL_TARGET+".",
      el("button",{class:"btn sm",onclick:()=>{
        const to=short.map(uid=>S.supervisors.find(u=>u.id===uid)?.email).filter(Boolean).join(",");
        openEmail(to,"MRes \u2014 CoC assessor nominations needed",
          "Dear colleagues,\n\nPlease log in to the Supervision Hub and nominate assessors for your students' Confirmation of Candidature under the \u201CCoC panel\u201D tab.\n\nWe ask each principal supervisor for more than three names, up to "+PANEL_TARGET+
          ", so panels can be seated without clashes.\n\nThank you,\nMRes Coordination\n");
      }},"\u2709 Chase them")));

    const sc=cardShell("Nominations by supervisor",null,"main");
    const t=el("table",{});
    t.append(el("thead",{},el("tr",{},...["Supervisor","Role","Students","Names","Nominees",""].map(h=>el("th",{},h)))));
    const tb=el("tbody",{});
    [...new Set([...principals,...S.supervisors.map(u=>u.id)])]
      .map(uid=>({uid,u:S.supervisors.find(x=>x.id===uid)}))
      .sort((a,b)=>String(a.u?.name||"").localeCompare(String(b.u?.name||"")))
      .forEach(({uid,u})=>{
        const ms=membersOf(poolOf(pools,uid));
        const nStu=students.filter(s=>s.principalUid===uid).length;
        const nCo=students.filter(s=>s.coUid===uid).length;
        const chips=el("div",{class:"row",style:"gap:5px"});
        if(!ms.length) chips.append(el("span",{class:"muted"},"\u2014"));
        else ms.forEach(m=>chips.append(seatChip(m)));
        const acts=el("div",{class:"row",style:"gap:5px"});
        /* Straight from the names a supervisor put forward to a working
           panel. This is the common case \u2014 the coordinator is usually
           reading the nominations precisely because they are about to seat
           the panel for that supervisor's students. */
        if(ms.length) acts.append(el("button",{class:"btn xs",
          onclick:()=>editMembers(null,{preset:ms,sourceUid:uid})},"Create panel"));
        acts.append(emailButton(u?.email,"MRes \u2014 CoC assessor nominations",
            "Dear "+(u?.name||"")+",\n\nCould you nominate assessors for your students' Confirmation of Candidature in the Supervision Hub? We ask for more than three names, up to "+PANEL_TARGET+
            ".\n\nThank you,\nMRes Coordination\n"));
        tb.append(el("tr",{},
          el("td",{},el("strong",{},u?.name||supName(uid))),
          el("td",{},nStu?el("span",{class:"pill blue"},"Principal"):el("span",{class:"pill none"},nCo?"Co-supervisor":"No students")),
          el("td",{class:"muted"},nStu+(nCo?" + "+nCo+" as co":"")),
          el("td",{},ms.length>=PANEL_MIN?el("span",{class:"pill approved"},ms.length):el("span",{class:"pill pending"},ms.length+" of "+PANEL_MIN)),
          el("td",{},chips),
          el("td",{},acts)));
      });
    t.append(tb); sc.append(t); host.append(sc);

    const cands=candidatePool().sort((a,b)=>b.nominators.length-a.nominators.length
      ||String(a.name).localeCompare(String(b.name)));
    const load=groupLoad(groups);
    host.append(sectionHead("\u2637","The pooled list",
      "Everyone suggested by anyone, merged, with their current assessing load.","info"));
    const pc=cardShell("All suggested names",el("span",{class:"muted ui"},cands.length+" people"),"info");
    if(!cands.length) pc.append(el("p",{class:"muted",style:"padding:18px;margin:0"},"No nominations have come in yet."));
    else{
      const t2=el("table",{});
      t2.append(el("thead",{},el("tr",{},...["Assessor","Type","Email","Mobile","Suggested by","Assessing","Contact"].map(h=>el("th",{},h)))));
      const tb2=el("tbody",{});
      cands.forEach(m=>{
        const contact=el("div",{class:"row",style:"gap:5px"});
        contact.append(emailButton(m.email,"MRes Confirmation of Candidature","Dear "+(m.name||"")+",\n\n"));
        contact.append(smsButton(m.mobile,"Hi "+(m.name||"")+", "));
        tb2.append(el("tr",{},
          el("td",{},el("strong",{},m.name||"\u2014")),
          el("td",{},m.kind==="internal"?el("span",{class:"pill none"},"Staff"):el("span",{class:"pill pending"},"External")),
          el("td",{class:"muted"},m.email||"\u2014"),
          el("td",{class:"muted"},m.mobile||"\u2014"),
          el("td",{class:"muted ui",style:"font-size:13px"},m.nominators.map(u=>supName(u)).join(", ")),
