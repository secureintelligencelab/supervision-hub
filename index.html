  // ================================================== PANELS & SCHEDULING
  function drawPanels(placed){
    // one-time migration from the old one-panel-per-student records
    if(legacy.length&&!groups.length){
      host.append(noticeBar("blue",
        legacy.length+" panel"+(legacy.length===1?" was":"s were")+
        " seated under the old one-panel-per-student model. Convert them into panel groups so they can be scheduled \u2014 students sharing the same assessors are merged, and split when a group would exceed "+PANEL_CAP+".",
        el("button",{class:"btn sm",onclick:()=>migrateLegacy()},"Convert "+legacy.length+" panels")));
    }
    /* The headline warning. Workload is a property of the assessor, not of
       any one panel, so it belongs here rather than buried in a card. */
    const over=overloadedMembers(groups);
    if(over.length) host.append(noticeBar("clay",
      over.map(x=>x.name+" \u2014 "+x.n+" students").join("; ")+
      ". "+(over.length===1?"That assessor has":"Those assessors have")+
      " been given more than the "+PANEL_CAP+" they should normally take. Move students to another panel, or accept it deliberately."));

    /* Coverage read supervisor by supervisor, which is how it gets chased.
       A supervisor with more than PANEL_CAP students cannot be covered by one
       panel however it is arranged, so say so rather than leaving the
       coordinator to discover it when the picker runs out of room. */
    const unassigned=students.filter(s=>!placed.has(s.id));
    if(unassigned.length){
      const bySup={};
      unassigned.forEach(s=>{ (bySup[s.principalUid||""] ||= []).push(s); });
      const parts=Object.keys(bySup)
        .sort((a,b)=>String(supName(a)).localeCompare(String(supName(b))))
        .map(uid=>{
          const n=bySup[uid].length;
          const total=students.filter(x=>x.principalUid===uid).length;
          return (uid?supName(uid):"No principal")+": "+n+
            (total>PANEL_CAP?" (of "+total+" \u2014 needs "+Math.ceil(total/PANEL_CAP)+" panels)":"");
        });
      host.append(noticeBar("amber",
        unassigned.length+(unassigned.length===1?" student has":" students have")+
        " no panel yet \u2014 "+parts.join("; ")+".",
        el("button",{class:"btn sm",onclick:()=>autoBuild()},"Build panels automatically")));
    }

    host.append(sectionHead("\u25A6","The panels",
      "Each panel is "+PANEL_SIZE+" assessors taking up to "+PANEL_CAP+
      " students. Work down each card: assessors, students, session, timetable.","info"));
    host.append(el("div",{class:"row",style:"gap:8px;margin-bottom:14px"},
      el("button",{class:"btn",onclick:()=>editMembers(null)},"+ Create a panel"),
      groups.length?el("button",{class:"btn ghost",onclick:()=>autoBuild()},"Fill remaining students"):el("span",{})));

    if(!groups.length){
      host.append(emptyState("No panels yet",
        "Create one and add "+PANEL_SIZE+" assessors, or let the app build them from the nominations."));
      return;
    }
    groups.sort((a,b)=>String(a.label).localeCompare(String(b.label))).forEach(g=>host.append(groupCard(g)));
  }

  function groupCard(g){
    const ms=groupMembers(g);
    const stu=groupStudents(g).map(id=>students.find(x=>x.id===id)).filter(Boolean);
    const chosen=groupSessions(g).find(s=>s.id===g.chosenSessionId);
    const common=commonSessions(g);

    const right=el("div",{class:"row",style:"gap:6px"},
      ms.length===PANEL_SIZE?el("span",{class:"pill approved"},PANEL_SIZE+" members")
                            :el("span",{class:"pill pending"},ms.length+" of "+PANEL_SIZE+" members"),
      stu.length>PANEL_CAP?el("span",{class:"pill missed"},stu.length+" students \u2014 over "+PANEL_CAP)
                          :el("span",{class:"pill none"},stu.length+" of "+PANEL_CAP+" students"),
      chosen?el("span",{class:"pill approved"},"Scheduled"):el("span",{class:"pill pending"},"Not scheduled"),
      groupClashes(ms,groupStudents(g),students).length
        ? el("span",{class:"pill missed",title:"An assessor supervises one of these students"},"Not independent")
        : el("span",{}),
      (()=>{
        const mine=overloadedMembers(groups).filter(x=>ms.some(m=>memberKey(m)===x.key));
        return mine.length
          ? el("span",{class:"pill missed",title:mine.map(x=>x.name+": "+x.n+" students").join("; ")},
              mine.length===1?mine[0].name+" over "+PANEL_CAP:mine.length+" assessors over "+PANEL_CAP)
          : el("span",{});
      })(),
      el("button",{class:"btn xs ghost",onclick:()=>renameGroup(g)},"Rename"),
      el("button",{class:"btn xs ghost",onclick:()=>confirmDeleteGroup(g)},"Delete"));
    const c=cardShell(g.label||"Panel",right,chosen?"ok":"main");
    // .panelbody drives the CSS step counter on the labels below
    const body=el("div",{class:"panelbody",style:"padding:14px 16px"});

    // ---- members + chair ----
    body.append(el("label",{},"Assessors"));
    if(!ms.length) body.append(el("p",{class:"muted",style:"margin:0 0 10px"},"No assessors yet."));
    else{
      const list=el("div",{class:"pgrid",style:"margin-bottom:10px"});
      ms.forEach(m=>{
        const acts=el("div",{class:"row",style:"gap:5px"});
        acts.append(isChair(g,m)
          ? el("span",{class:"pill blue"},"Chair")
          : el("button",{class:"btn xs ghost",onclick:async()=>{
              try{ await saveGroup({...g,chairKey:availKey(m)}); }
              catch(err){ toast(err?.message||"Could not save.",true); return; }
              toast((m.name||"Member")+" is now chair."); reload();
            }},"Make chair"));
        if(m.kind==="external"){
          const done=groupSessions(g).filter(s=>availOf(g,m,s.id)!==undefined).length;
          acts.append(el("button",{class:"btn xs "+(groupSessions(g).length&&done<groupSessions(g).length?"":"ghost"),
            onclick:()=>externalAvail(g,m)},"Enter availability"+
            (groupSessions(g).length?" ("+done+"/"+groupSessions(g).length+")":"")));
        }
        acts.append(emailButton(m.email,"MRes CoC panel \u2014 "+(g.label||""),
          "Dear "+(m.name||"")+",\n\n","\u2709","btn xs ghost"));
        list.append(memberLine(m,el("div",{class:"row",style:"gap:5px"},
          loadPill(groupLoad(groups).get(memberKey(m))||0)),acts));
      });
      body.append(list);
    }
    body.append(el("div",{class:"row",style:"margin-bottom:16px"},
      el("button",{class:"btn sm ghost",onclick:()=>editMembers(g)},"Edit assessors")));

    // ---- students ----
    body.append(el("label",{},"Students"));
    const chips=el("div",{class:"row",style:"gap:5px;margin-bottom:10px"});
    if(!stu.length) chips.append(el("span",{class:"muted"},"None assigned."));
    else stu.forEach(s=>chips.append(el("span",{class:"seatchip"},s.name+(s.sid?" ("+s.sid+")":""))));
    body.append(chips,el("div",{class:"row",style:"margin-bottom:16px"},
      el("button",{class:"btn sm ghost",onclick:()=>editStudents(g)},"Assign students")));

    // ---- timing: one section, whether you polled for it or just set it ----
    body.append(el("label",{},"CoC session"));
    if(chosen) body.append(noticeBar(sessionWorks(g,chosen)?"green":"amber",
      "Booked for "+sessionLabel(chosen)+
      (sessionWorks(g,chosen)
        ? " \u2014 suits every assessor."
        : " \u2014 you set this over the availability replies. Tell the assessors it has moved.")));
    if(!groupSessions(g).length){
      body.append(el("p",{class:"muted",style:"margin:0 0 10px"},
        "Set the time directly if you already know it. Or propose a few half-days and let the assessors tick what suits \u2014 you can still book any of them."));
    }else{
      body.append(availabilityTable(g));
    }
    const sessBtns=el("div",{class:"row",style:"gap:8px;margin-bottom:16px"},
      el("button",{class:"btn sm",onclick:()=>setTimeDirect(g)},
        chosen?"Change the time":"Set the time directly"),
      el("button",{class:"btn sm ghost",onclick:()=>addSession(g)},"+ Propose a session"));
    if(groupSessions(g).length){
      const waiting=ms.filter(m=>m.kind==="internal"
        &&groupSessions(g).some(s=>availOf(g,m,s.id)===undefined));
      if(waiting.length) sessBtns.append(el("button",{class:"btn sm ghost",onclick:()=>{
        openEmail(waiting.map(m=>m.email).filter(Boolean).join(","),
          "MRes CoC panel \u2014 your availability is needed",
          "Dear colleagues,\n\nPlease log in to the Supervision Hub, open the \u201CCoC panel\u201D tab and tick your availability for "+
          (g.label||"the panel")+":\n\n"+groupSessions(g).map(s=>"  \u2022 "+sessionLabel(s)).join("\n")+
          "\n\nWe can only book a session that suits all "+ms.length+" assessors.\n\nThank you,\nMRes Coordination\n");
      }},"\u2709 Chase "+waiting.length+" for availability"));
    }
    body.append(sessBtns);

    if(chosen) body.append(timetableBlock(g,chosen,stu));
    c.append(body); return c;
  }

  /* The matrix, with a Book button on every row. Sessions everyone accepted
     are the obvious pick, but the coordinator can book ANY of them \u2014 plans
     change after a phone call, and the tool should not argue. Booking over a
     "not available" just asks for confirmation and then says so on the card. */
  function availabilityTable(g){
    const ms=groupMembers(g);
    const t=el("table",{});
    t.append(el("thead",{},el("tr",{},
      el("th",{},"Session"),
      ...ms.map(m=>el("th",{},(m.name||"?")+(m.kind==="external"?" (ext)":""))),
      el("th",{},"Suits all?"),el("th",{},""))));
    const tb=el("tbody",{});
    groupSessions(g).forEach(s=>{
      const works=sessionWorks(g,s), booked=s.id===g.chosenSessionId;
      const cells=ms.map(m=>{
        const a=availOf(g,m,s.id);
        return el("td",{},a===true?el("span",{class:"pill approved"},"Available")
          :a===false?el("span",{class:"pill missed"},"Not available")
          :el("span",{class:"pill pending"},m.kind==="external"?"Admin to enter":"Awaiting reply"));
      });
      const acts=el("div",{class:"row",style:"gap:5px"});
      acts.append(el("button",{class:"btn xs "+(booked?"green":works?"":"ghost"),
        onclick:()=>bookSession(g,s)},booked?"\u2713 Booked":"Book"));
      acts.append(el("button",{class:"btn xs ghost",onclick:()=>removeSession(g,s)},"Remove"));
      tb.append(el("tr",{},
        el("td",{},el("strong",{},sessionLabel(s))),
        ...cells,
        el("td",{},works?el("span",{class:"pill approved"},"Yes")
          :el("span",{class:"pill none"},availCounts(g,s).yes+" of "+ms.length)),
        el("td",{},acts)));
    });
    t.append(tb);
    const wrap=el("div",{style:"margin-bottom:10px"}); wrap.append(t);
    return wrap;
  }

  function timetableBlock(g,chosen,stu){
    const built=buildSlots(chosen,groupStudents(g),g.slotMins||PANEL_SLOT_MINS);
    const saved=(g.slots||[]);
    const wrap=el("div",{style:"margin-top:6px"});
    wrap.append(el("label",{},"Presentation timetable \u2014 "+sessionLabel(chosen)));

    const mins=el("select",{},...[15,20,30,45,60].map(n=>
      el("option",{value:String(n),...(Number(g.slotMins||PANEL_SLOT_MINS)===n?{selected:"selected"}:{})},n+" min each")));
    const ctl=el("div",{class:"row",style:"gap:8px;margin-bottom:10px"},
      mins,
      el("button",{class:"btn sm",onclick:()=>regenerate(g,Number(mins.value))},
        saved.length?"Regenerate timetable":"Generate timetable"));
    wrap.append(ctl);

    if(built.unplaced.length) wrap.append(noticeBar("amber",
      built.unplaced.length+(built.unplaced.length===1?" student doesn't":" students don't")+
      " fit in this session at "+(g.slotMins||PANEL_SLOT_MINS)+" minutes each (room for "+built.capacity+
      ", keeping "+PANEL_BUFFER_MINS+" minutes for panel discussion). Shorten the slots, extend the session, or move someone to another panel."));

    if(!saved.length){
      wrap.append(el("p",{class:"muted",style:"margin:0"},
        "Nothing generated yet \u2014 press Generate to allocate the "+stu.length+" students into slots."));
      return wrap;
    }
    const t=el("table",{});
    t.append(el("thead",{},el("tr",{},...["Time","Student","ID","Principal supervisor",""].map(h=>el("th",{},h)))));
    const tb=el("tbody",{});
    saved.forEach((sl,i)=>{
      const s=students.find(x=>x.id===sl.studentDocId);
      const acts=el("div",{class:"row",style:"gap:5px"},
        el("button",{class:"btn xs ghost",onclick:()=>editSlot(g,i)},"Edit"),
        el("button",{class:"btn xs ghost",onclick:()=>{
          persist({...g,slots:saved.filter((_,j)=>j!==i)},"Slot removed.");
        }},"Remove"));
      tb.append(el("tr",{},
        el("td",{},el("strong",{},prettyTime(sl.start)+"\u2013"+prettyTime(sl.end))),
        el("td",{},s?s.name:el("span",{class:"muted"},sl.studentDocId?"(student removed)":"Buffer / discussion")),
        el("td",{class:"muted"},s?.sid||"\u2014"),
        el("td",{class:"muted"},s?.principalName||"\u2014"),
        el("td",{},acts)));
    });
    const last=saved[saved.length-1];
    if(last&&minsOf(last.end)<minsOf(chosen.end)) tb.append(el("tr",{},
      el("td",{},el("strong",{},prettyTime(last.end)+"\u2013"+prettyTime(chosen.end))),
      el("td",{class:"muted",colspan:"4"},"Buffer / panel discussion")));
    t.append(tb); wrap.append(t);

    // who has a panel but no slot on it \u2014 easy to create by hand-editing
    const placed=new Set(saved.map(x=>x.studentDocId).filter(Boolean));
    const off=groupStudents(g).filter(id=>!placed.has(id))
      .map(id=>students.find(x=>x.id===id)).filter(Boolean);
    if(off.length) wrap.append(noticeBar("amber",
      off.map(x=>x.name).join(", ")+(off.length===1?" is":" are")+" on this panel but not in the timetable."));

    wrap.append(el("div",{class:"row",style:"gap:8px;margin-top:10px"},
      el("button",{class:"btn sm ghost",onclick:()=>editSlot(g,-1)},"+ Add a slot")));
    return wrap;
  }

  // ---------------------------------------------------- actions
  async function persist(g,msg){
    try{ await saveGroup(g); }catch(err){ toast(err?.message||"Could not save.",true); return false; }
    if(msg) toast(msg);
    await reload(); return true;
  }
  function nextLabel(){
    const used=new Set(groups.map(g=>g.label));
    for(let i=0;i<26;i++){ const l="Panel "+String.fromCharCode(65+i); if(!used.has(l)) return l; }
    return "Panel "+(groups.length+1);
  }
  function renameGroup(g){
    const inp=el("input",{value:g.label||""});
    modal("Rename panel",el("div",{class:"grid"},el("div",{},el("label",{},"Name"),inp)),
      async()=>{ if(!inp.value.trim()){toast("A name is needed.",true);return false;}
        return persist({...g,label:inp.value.trim()},"Renamed."); },"Save");
  }
  function confirmDeleteGroup(g){
    modal("Delete "+(g.label||"panel")+"?",
      el("p",{class:"muted",style:"margin:0"},
        "The "+groupStudents(g).length+" student(s) go back to unassigned, and the availability and timetable for this panel are discarded. The assessors stay in the nomination pool."),
      async()=>{
        try{ await DB.remove("panelGroups",g.id); }catch(err){ toast(err?.message||"Could not delete.",true); return false; }
        toast("Panel deleted."); await reload(); return true;
      },"Delete");
  }

  function addSession(g){
    const date=el("input",{type:"date"});
    const start=el("input",{type:"time",value:"13:00"});
    const end=el("input",{type:"time",value:"16:30"});
    modal("Propose a session",
      el("div",{class:"grid"},
        el("div",{},el("label",{},"Date"),date),
        el("div",{class:"row",style:"gap:10px"},
          el("div",{style:"flex:1"},el("label",{},"From"),start),
          el("div",{style:"flex:1"},el("label",{},"To"),end)),
        el("div",{},el("p",{class:"muted",style:"margin:0"},
          "Propose 4\u20135 half-days across different days. Assessors tick each one; you only get to book a session everybody accepted."))),
      async()=>{
        if(!date.value){ toast("Pick a date.",true); return false; }
        if(minsOf(end.value)<=minsOf(start.value)){ toast("The finish time must be after the start.",true); return false; }
        const s={id:nomId(),date:date.value,start:start.value,end:end.value};
        return persist({...g,sessions:groupSessions(g).concat([s])},"Session proposed.");
      },"Add session");
  }
  function removeSession(g,s){
    const av=JSON.parse(JSON.stringify(g.availability||{}));
    Object.keys(av).forEach(k=>{ delete av[k][s.id]; });
    const next={...g,sessions:groupSessions(g).filter(x=>x.id!==s.id),availability:av};
    if(g.chosenSessionId===s.id){ next.chosenSessionId=""; next.slots=[]; }
    persist(next,"Session removed.");
  }
  /* Book a session. If someone said no, say who and ask once \u2014 then do it.
     The coordinator has spoken to people; the app has not. */
  function bookSession(g,s){
    if(!sessionWorks(g,s)){
      const no=groupMembers(g).filter(m=>availOf(g,m,s.id)===false).map(m=>m.name);
      const quiet=groupMembers(g).filter(m=>availOf(g,m,s.id)===undefined).map(m=>m.name);
      const why=[no.length?no.join(", ")+" said they can't make it":"",
                 quiet.length?quiet.join(", ")+" hasn't replied":""].filter(Boolean).join("; ");
      if(!window.confirm("Book "+sessionLabel(s)+" anyway?\n\n"+why+
        ".\n\nThe panel will be told this is the booked time.")) return;
    }
    const built=buildSlots(s,groupStudents(g),g.slotMins||PANEL_SLOT_MINS);
    persist({...g,chosenSessionId:s.id,slots:built.slots},
      "Booked for "+sessionLabel(s)+" \u2014 timetable generated.");
  }

  /* Skip the poll entirely. This is the "we agreed it on the phone" path, and
     it is the shortest route from nothing to a finished timetable. */
  function setTimeDirect(g){
    const cur=groupSessions(g).find(x=>x.id===g.chosenSessionId);
    const date=el("input",{type:"date",value:cur?.date||""});
    const start=el("input",{type:"time",value:cur?.start||"13:00"});
    const end=el("input",{type:"time",value:cur?.end||"16:30"});
    modal(cur?"Change the CoC time":"Set the CoC time",
      el("div",{class:"grid"},
        el("div",{},el("label",{},"Date"),date),
        el("div",{class:"row",style:"gap:10px"},
          el("div",{style:"flex:1"},el("label",{},"From"),start),
          el("div",{style:"flex:1"},el("label",{},"To"),end)),
        el("div",{},el("p",{class:"muted",style:"margin:0"},
          "Books the panel straight away and lays out the timetable. Availability replies are left on record but not enforced \u2014 use this when the time has already been agreed."))),
      async()=>{
        if(!date.value){ toast("Pick a date.",true); return false; }
        if(minsOf(end.value)<=minsOf(start.value)){ toast("The finish time must be after the start.",true); return false; }
        // edit the booked session in place when it was also admin-set, so
        // repeated changes don't leave a trail of dead rows in the matrix
        const reuse=cur&&cur.direct;
        const sess=reuse
          ? {...cur,date:date.value,start:start.value,end:end.value}
          : {id:nomId(),date:date.value,start:start.value,end:end.value,direct:true};
        const sessions=reuse
          ? groupSessions(g).map(x=>x.id===cur.id?sess:x)
          : groupSessions(g).concat([sess]);
        const built=buildSlots(sess,groupStudents(g),g.slotMins||PANEL_SLOT_MINS);
        return persist({...g,sessions,chosenSessionId:sess.id,slots:built.slots},
          "Booked for "+sessionLabel(sess)+".");
      },"Book this time");
  }
  function regenerate(g,slotMins){
    const s=groupSessions(g).find(x=>x.id===g.chosenSessionId);
    if(!s) return;
    const built=buildSlots(s,groupStudents(g),slotMins);
    persist({...g,slotMins,slots:built.slots},"Timetable regenerated.");
  }

  /* Hand-edit one slot: retime it, put a different student in it, or leave it
     empty as extra discussion time. Index -1 appends. Nothing here is checked
     against the session bounds or the other slots on purpose \u2014 the
     coordinator sometimes needs a 15-minute gap or an overrun, and the
     generated grid is only ever a starting point. */
  function editSlot(g,i){
    const saved=(g.slots||[]);
    const cur=i>=0?saved[i]:null;
    const sess=groupSessions(g).find(x=>x.id===g.chosenSessionId);
    const last=saved[saved.length-1];
    const start=el("input",{type:"time",value:cur?.start||last?.end||sess?.start||"13:00"});
    const end=el("input",{type:"time",value:cur?.end||hhmm(minsOf(last?.end||sess?.start||"13:00")+(g.slotMins||PANEL_SLOT_MINS))});
    const who=el("select",{});
    who.append(el("option",{value:""},"\u2014 buffer / discussion \u2014"));
    groupStudents(g).forEach(id=>{
      const st=students.find(x=>x.id===id); if(!st) return;
      who.append(el("option",{value:id,...(cur?.studentDocId===id?{selected:"selected"}:{})},
        st.name+(st.sid?" ("+st.sid+")":"")));
    });
    modal(i>=0?"Edit slot":"Add a slot",
      el("div",{class:"grid"},
        el("div",{class:"row",style:"gap:10px"},
          el("div",{style:"flex:1"},el("label",{},"From"),start),
          el("div",{style:"flex:1"},el("label",{},"To"),end)),
        el("div",{},el("label",{},"Student"),who),
        el("div",{},el("p",{class:"muted",style:"margin:0"},
          "Times are yours to set \u2014 nothing is forced back onto the half-hour grid. Regenerating the timetable will overwrite hand edits."))),
      async()=>{
        if(minsOf(end.value)<=minsOf(start.value)){ toast("The finish time must be after the start.",true); return false; }
        const slot={start:start.value,end:end.value,studentDocId:who.value||""};
        const next=i>=0?saved.map((x,j)=>j===i?slot:x):saved.concat([slot]);
        next.sort((a,b)=>minsOf(a.start)-minsOf(b.start));
        return persist({...g,slots:next},i>=0?"Slot updated.":"Slot added.");
      },"Save slot");
  }

  /* An external has no login, so the coordinator relays what they said by
     phone or email. Same three states as an internal member's own answer. */
  function externalAvail(g,m){
    const sess=groupSessions(g);
    if(!sess.length){ toast("Propose some sessions first.",true); return; }
    const picks={};
    const rows=el("div",{class:"pgrid"});
    sess.forEach(s=>{
      picks[s.id]=availOf(g,m,s.id);
      const row=el("div",{class:"pmember ext"});
      const btns=el("div",{class:"row",style:"gap:5px"});
      const paint=()=>{
        [...btns.children].forEach(b=>b.className="btn xs "+
          (String(picks[s.id])===b.dataset.v?(b.dataset.v==="true"?"green":"clay"):"ghost"));
      };
      [["Available","true","green"],["Not available","false","clay"]].forEach(([lab,val])=>{
        const b=el("button",{class:"btn xs ghost","data-v":val,onclick:()=>{
          picks[s.id]=(val==="true"); paint();
        }},lab);
        btns.append(b);
      });
      row.append(el("div",{class:"pm-main"},
        el("div",{class:"pm-nm"},sessionLabel(s)),
        el("div",{class:"pm-sub"},"as reported by "+(m.name||"the assessor"))),btns);
      rows.append(row); paint();
    });
    modal("Availability for "+(m.name||"external assessor"),
      el("div",{class:"grid"},
        el("div",{class:"muted ui",style:"font-size:13.5px"},
          (m.email||"no email on file")+(m.mobile?" \u00B7 "+m.mobile:"")+
          " \u2014 external assessors have no login, so record what they told you."),
        rows),
      async()=>{
        const av=JSON.parse(JSON.stringify(g.availability||{}));
        const k=availKey(m); av[k]=av[k]||{};
        Object.entries(picks).forEach(([sid,val])=>{ if(val===undefined) delete av[k][sid]; else av[k][sid]=val; });
        try{ await saveAvailability(g.id,av); }
        catch(err){ toast(err?.message||"Could not save.",true); return false; }
        toast("Availability recorded."); await reload(); return true;
      },"Save availability");
  }

  /* Assessor picker. Conflicts are computed against every student already in
     the group, and shown greyed with the clashing student named. */
  function editMembers(g,opts){
    const existing=g?groupMembers(g):[];
    const sids=g?groupStudents(g):[];
    /* `preset` comes from the Nominations tab: seat the first PANEL_SIZE names
       a supervisor put forward, with the rest of their list still one click
       away in the picker below. The coordinator can change any of it before
       saving \u2014 this is a head start, not a decision. */
    let chosen=existing.length?existing.slice()
      :(opts?.preset||[]).slice(0,PANEL_SIZE).map(cleanMember);
    let chairKey=g?.chairKey||(chosen[0]?availKey(chosen[0]):"");
    const load=groupLoad(groups,g?.id);

    const pooled=candidatePool();
    const pooledKeys=new Set(pooled.map(memberKey));
    let cands=pooled.concat(S.supervisors.filter(u=>!pooledKeys.has("u:"+u.id))
      .map(u=>({id:nomId(),kind:"internal",uid:u.id,name:u.name||u.email,
                email:u.email||"",mobile:u.mobile||"",org:"Internal",nominators:[]})));

    const search=el("input",{placeholder:"Search name, email, institution\u2026"});
    const chipBox=el("div",{class:"row",style:"gap:6px;min-height:30px"});
    const listBox=el("div",{class:"picklist"});
    const status=el("div",{class:"muted ui",style:"font-size:13px"});
    const isOn=m=>chosen.some(c=>memberKey(c)===memberKey(m));

    function clashFor(m){
      return groupClashes([m],sids,students).map(x=>x.s.name);
    }
    function paint(){
      chipBox.innerHTML="";
      if(!chosen.length) chipBox.append(el("span",{class:"muted"},"No assessors chosen."));
      chosen.forEach(m=>{
        const chip=seatChip(m,()=>{
          chosen=chosen.filter(c=>memberKey(c)!==memberKey(m));
          if(chairKey===availKey(m)) chairKey="";
          paint();
        });
        if(availKey(m)===chairKey) chip.prepend(el("span",{style:"font-size:11px;font-weight:800"},"CHAIR "));
        chipBox.append(chip);
      });
      status.textContent=chosen.length===PANEL_SIZE?"A full panel of "+PANEL_SIZE+"."
        :chosen.length<PANEL_SIZE?(PANEL_SIZE-chosen.length)+" more to reach the usual panel of "+PANEL_SIZE+"."
        :chosen.length+" members \u2014 larger than the usual "+PANEL_SIZE+".";

      chairSel.innerHTML="";
      chairSel.append(el("option",{value:""},"\u2014 no chair yet \u2014"));
      chosen.forEach(m=>chairSel.append(el("option",{value:availKey(m),
        ...(availKey(m)===chairKey?{selected:"selected"}:{})},m.name||"?")));

      listBox.innerHTML="";
      const term=search.value.trim().toLowerCase();
      const rows=cands.filter(m=>!term||[m.name,m.email,m.org].some(x=>(x||"").toLowerCase().includes(term)))
        .map(m=>({m,clash:clashFor(m),n:load.get(memberKey(m))||0,
                  nominated:(m.nominators||[]).length?0:1}))
        .sort((a,b)=>(a.clash.length?1:0)-(b.clash.length?1:0)||a.nominated-b.nominated
          ||a.n-b.n||String(a.m.name).localeCompare(String(b.m.name)));
      if(!rows.length){ listBox.append(el("div",{class:"muted",style:"padding:16px"},"Nobody matches that search.")); return; }
      rows.forEach(({m,clash,n})=>{
        const on=isOn(m);
        const tags=el("div",{class:"row",style:"gap:5px"});
        if(clash.length) tags.append(el("span",{class:"pill missed"},"Supervises "+clash.join(", ")));
        else{
          if((m.nominators||[]).length) tags.append(el("span",{class:"pill none"},"Nominated \u00D7"+m.nominators.length));
          else tags.append(el("span",{class:"pill none"},"Not nominated"));
          tags.append(loadPill(n));
        }
        listBox.append(el("div",{class:"pickrow"+(clash.length?" warn":"")+(on?" on":""),
          onclick:()=>{
            if(on){ chosen=chosen.filter(c=>memberKey(c)!==memberKey(m)); if(chairKey===availKey(m)) chairKey=""; }
            else{
              if(clash.length) toast((m.name||"That assessor")+" supervises "+clash.join(", ")+
                " \u2014 allowed, but the panel is no longer independent for them.");
              else if(n+sids.length>PANEL_CAP) toast((m.name||"That assessor")+" has already been assigned "+n+
                " students \u2014 this panel's "+sids.length+" would make "+(n+sids.length)+", over the usual "+PANEL_CAP+".");
              chosen=chosen.concat([cleanMember(m)]);
            }
            paint();
          }},
          el("div",{class:"tick"},on?"\u2713":""),
          el("div",{class:"pk-main"},
            el("div",{class:"pk-nm"},m.name||"\u2014"),
            el("div",{class:"pk-sub"},[m.email||"no email",m.org||(m.kind==="internal"?"Internal":"External")].join(" \u00B7 "))),
          tags));
      });
    }
    const chairSel=el("select",{onchange:e=>{ chairKey=e.target.value; paint(); }});
    search.oninput=paint;

    modal(g?"Assessors for "+(g.label||"panel"):"Create a panel",
      el("div",{class:"grid"},
        el("div",{},el("label",{},"Chosen assessors"),chipBox,el("div",{style:"margin-top:6px"},status)),
        el("div",{},el("label",{},"Panel chair"),chairSel),
        el("div",{},el("label",{},"Search candidates"),search),
        listBox,
        el("div",{class:"row"},
          el("button",{class:"btn ghost sm",onclick:()=>nominateExternal(null,m=>{
            const cm=cleanMember(m);
            cands=cands.concat([{...cm,nominators:[]}]);
            chosen=chosen.concat([cm]); paint();
          })},"+ Add an external assessor"))),
      async()=>{
        if(!chosen.length){ toast("Choose at least one assessor.",true); return false; }
        const clashes=groupClashes(chosen,sids,students);
        if(clashes.length&&!window.confirm(
          clashes.map(c=>c.m.name+" supervises "+c.s.name).join("\n")+
          "\n\nAn assessor normally can't sit on their own student's panel. Save anyway?")) return false;
        const wouldM=overloadedMembers(groups,{skipGroupId:g?.id,members:chosen,studentCount:sids.length});
        if(wouldM.length&&!window.confirm(
          wouldM.map(x=>x.name+" would have "+x.n+" students").join("\n")+
          "\n\nAn assessor should normally take no more than "+PANEL_CAP+". Save anyway?")) return false;
        if(chosen.length<PANEL_SIZE&&!window.confirm(
          "This panel has only "+chosen.length+" of the usual "+PANEL_SIZE+" assessors. Save it anyway?")) return false;
        const rec={...(g||{label:nextLabel(),studentIds:[],sessions:[],availability:{},
                           slots:[],slotMins:PANEL_SLOT_MINS,chosenSessionId:""}),
                   members:chosen,chairKey};
        let newId;
        try{ newId=await saveGroup(rec); }
        catch(err){ toast(err?.message||"Could not save.",true); return false; }
        toast(g?"Assessors updated.":"Panel created \u2014 now choose its students.");
        await reload();
        // straight on to the students, pre-filtered to whoever's names these were
        if(!g){
          S.panelTab="panels";
          const made=groups.find(x=>x.id===newId);
          if(made) setTimeout(()=>editStudents(made,{focusUid:opts?.sourceUid}),0);
        }
        return true;
      },g?"Save assessors":"Create panel");
    const mm=document.querySelectorAll(".modal"); if(mm.length) mm[mm.length-1].classList.add("wide");
    paint();
  }

  /* Student picker for a group. A student already on another panel is shown
     but blocked — moving them means taking them off that one first, and
     silently reassigning would break the other panel's timetable. */
  function editStudents(g,opts){
    let chosen=groupStudents(g).slice();
    const ms=groupMembers(g);
    const search=el("input",{placeholder:"Search student name or ID\u2026"});
    const listBox=el("div",{class:"picklist"});
    const status=el("div",{class:"muted ui",style:"font-size:13px"});
    const elsewhere=new Map();
    groups.filter(x=>x.id!==g.id).forEach(x=>groupStudents(x).forEach(id=>elsewhere.set(id,x)));

    /* Default the list to this panel's own discipline \u2014 an IT panel is
       almost always seating IT students \u2014 but never hide the rest behind a
       rule, because cross-disciplinary projects exist. */
    const preferred=defaultArea(ms,opts?.focusUid);
    const areaSel=el("select",{},
      el("option",{value:""},"All areas"),
      ...AREAS.map(a=>el("option",{value:a,...(preferred===a?{selected:"selected"}:{})},a+" students")));
    const supSel=el("select",{},el("option",{value:""},"All supervisors"));
    [...new Set(students.map(x=>x.principalUid).filter(Boolean))]
      .map(uid=>({uid,name:supName(uid)}))
      .sort((a,b)=>String(a.name).localeCompare(String(b.name)))
      .forEach(x=>supSel.append(el("option",{value:x.uid,
        ...(opts?.focusUid===x.uid?{selected:"selected"}:{})},x.name)));

    function paint(){
      status.innerHTML="";
      status.append(chosen.length+" of "+PANEL_CAP+" students"+
        (chosen.length>PANEL_CAP?" \u2014 over the usual maximum for one panel.":"."));
      /* What this saving would do to each assessor's total, counted across
         every panel they sit on — not just this one. */
      const would=overloadedMembers(groups,{skipGroupId:g.id,members:ms,studentCount:chosen.length});
      if(would.length){
        status.append(el("div",{style:"margin-top:6px;font-weight:700;color:var(--clay-ink,#9a3412)"},
          would.map(x=>x.name+" would then have "+x.n+" students").join("; ")+
          " \u2014 more than the "+PANEL_CAP+" an assessor should normally take."));
      }
      listBox.innerHTML="";
      const term=search.value.trim().toLowerCase();
      const shown=students.filter(s=>
        (!term||[s.name,s.sid].some(x=>(x||"").toLowerCase().includes(term)))
        &&(!areaSel.value||s.area===areaSel.value)
        &&(!supSel.value||s.principalUid===supSel.value));
      if(!shown.length){
        listBox.append(el("div",{class:"muted",style:"padding:16px"},
          "No students match those filters."));
        return;
      }
      /* Grouped under the principal supervisor, because that is how the
         coordinator thinks about coverage. The sub-line is the important
         part: it says how many of that supervisor's students still have no
         panel, so it is obvious when one supervisor needs a second panel. */
      const bySup={};
      shown.forEach(s=>{ (bySup[s.principalUid||""] ||= []).push(s); });
      Object.keys(bySup)
        .sort((a,b)=>String(supName(a)).localeCompare(String(supName(b))))
        .forEach(uid=>{
          const list=bySup[uid];
          const all=students.filter(x=>x.principalUid===uid);
          const here=all.filter(x=>chosen.includes(x.id)).length;
          const away=all.filter(x=>!chosen.includes(x.id)&&elsewhere.has(x.id)).length;
          const free=all.length-here-away;
          const head=el("div",{class:"pickgroup"},
            el("span",{class:"pg-nm"},uid?supName(uid):"No principal supervisor"),
            el("span",{class:"pg-sub"},
              all.length+" student"+(all.length===1?"":"s")+" \u00B7 "+here+" on this panel"+
              (away?" \u00B7 "+away+" on other panels":"")+
              (free?" \u00B7 "+free+" unassigned":" \u00B7 all covered")));
          if(all.length>PANEL_CAP) head.append(el("span",{class:"pill pending",
            title:"More than "+PANEL_CAP+" students, so they can't all sit with one panel"},
            "needs "+Math.ceil(all.length/PANEL_CAP)+" panels"));
          // one click to take as many of this supervisor's free students as
          // there is room for, which is the usual move
          const room=PANEL_CAP-chosen.length;
          const takeable=list.filter(x=>!chosen.includes(x.id)&&!elsewhere.has(x.id)).slice(0,Math.max(0,room));
          if(takeable.length) head.append(el("button",{class:"btn xs ghost",onclick:e=>{
            e.stopPropagation();
            chosen=chosen.concat(takeable.map(x=>x.id)); paint();
          }},"+ Add "+takeable.length));
          listBox.append(head);
          list.sort((a,b)=>String(a.name).localeCompare(String(b.name))).forEach(s=>{
          const on=chosen.includes(s.id);
          const clash=groupClashes(ms,[s.id],students).map(x=>x.m.name);
          const other=!on&&elsewhere.get(s.id);
          const tags=el("div",{class:"row",style:"gap:5px"});
          if(clash.length) tags.append(el("span",{class:"pill missed"},"Supervised by "+clash.join(", ")));
          else if(other) tags.append(el("span",{class:"pill pending"},"On "+other.label));
          else tags.append(el("span",{class:"pill none"},s.area||"\u2014"));
          listBox.append(el("div",{class:"pickrow"+((clash.length||other)?" warn":"")+(on?" on":""),
            onclick:()=>{
              if(!on&&clash.length) toast(s.name+" is supervised by "+clash.join(", ")+
                " \u2014 allowed, but this panel is no longer independent for them.");
              else if(!on&&other) toast(s.name+" will be moved off "+other.label+".");
              chosen=on?chosen.filter(x=>x!==s.id):chosen.concat([s.id]);
              if(!on){
                const would=overloadedMembers(groups,{skipGroupId:g.id,members:ms,studentCount:chosen.length});
                if(would.length) toast(would[0].name+" has already been assigned "+PANEL_CAP+
                  " students \u2014 this would make "+would[0].n+".");
                else if(chosen.length>PANEL_CAP) toast("That's more than the usual "+PANEL_CAP+" students for one panel.");
              }
              paint();
            }},
            el("div",{class:"tick"},on?"\u2713":""),
            el("div",{class:"pk-main"},
              el("div",{class:"pk-nm"},s.name),
              el("div",{class:"pk-sub"},[s.sid||"no ID",s.principalName||"no principal"].join(" \u00B7 "))),
            tags));
          });
        });
    }
    search.oninput=paint; areaSel.onchange=paint; supSel.onchange=paint;
    modal("Students for "+(g.label||"panel"),
      el("div",{class:"grid"},
        el("div",{},status),
        el("div",{class:"row",style:"gap:10px"},
          el("div",{style:"flex:1;min-width:130px"},el("label",{},"Area"),areaSel),
          el("div",{style:"flex:1;min-width:150px"},el("label",{},"Principal supervisor"),supSel)),
        el("div",{},el("label",{},"Search"),search),
        listBox,
        el("div",{},el("p",{class:"muted",style:"margin:0"},
          "A supervisor's students don't have to sit with one panel \u2014 split them across panels freely, and a supervisor with more than "+PANEL_CAP+
          " will need more than one. Picking a student who is already on another panel moves them here."))),
      async()=>{
        const clashes=groupClashes(ms,chosen,students);
        if(clashes.length&&!window.confirm(
          clashes.map(c=>c.m.name+" supervises "+c.s.name).join("\n")+
          "\n\nAn assessor normally can't sit on their own student's panel. Save anyway?")) return false;
        const would=overloadedMembers(groups,{skipGroupId:g.id,members:ms,studentCount:chosen.length});
        if(would.length&&!window.confirm(
          would.map(x=>x.name+" would have "+x.n+" students").join("\n")+
          "\n\nAn assessor should normally take no more than "+PANEL_CAP+". Save anyway?")) return false;
        /* Take anyone we've claimed off their previous panel, including its
           timetable, so two panels can never both think they have a student. */
        const moved=chosen.filter(id=>elsewhere.has(id));
        for(const id of moved){
          const from=elsewhere.get(id);
          try{
            await DB.update("panelGroups",from.id,{
              studentIds:groupStudents(from).filter(x=>x!==id),
              slots:(from.slots||[]).filter(sl=>sl.studentDocId!==id),
              updatedAt:Date.now()});
          }catch(err){ toast(err?.message||"Could not move the student.",true); return false; }
        }
        // keep hand-edited slots; only re-lay-out the students actually added
        const keep=(g.slots||[]).filter(sl=>!sl.studentDocId||chosen.includes(sl.studentDocId));
        const seated=new Set(keep.map(sl=>sl.studentDocId).filter(Boolean));
        const sess=groupSessions(g).find(x=>x.id===g.chosenSessionId);
        let slots=keep;
        if(sess){
          const extra=chosen.filter(id=>!seated.has(id));
          let t=keep.length?Math.max(...keep.map(sl=>minsOf(sl.end))):minsOf(sess.start);
          const per=g.slotMins||PANEL_SLOT_MINS;
          extra.forEach(id=>{ slots=slots.concat([{start:hhmm(t),end:hhmm(t+per),studentDocId:id}]); t+=per; });
          slots.sort((a,b)=>minsOf(a.start)-minsOf(b.start));
        }
        const ok=await persist({...g,studentIds:chosen,slots},
          "Students updated."+(moved.length?" "+moved.length+" moved from another panel.":""));
        return ok;
      },"Save students");
    const mm=document.querySelectorAll(".modal"); if(mm.length) mm[mm.length-1].classList.add("wide");
    paint();
  }

  /* Build panels for whoever is still unassigned: take the lowest-loaded
     nominees who don't supervise anyone in the batch. Leaves a panel short
     rather than break the independence rule. */
  async function autoBuild(){
    if(S.panelSeating){ toast("Still building \u2014 one moment."); return; }
    const cands=candidatePool();
    if(!cands.length){ toast("No nominations on file to build from yet.",true); return; }
    S.panelSeating=true;
    try{
      let live=await DB.list("panelGroups",{semesterId:S.activeSem});
      const placed=new Set(live.flatMap(groupStudents));
      let pending=students.filter(s=>!placed.has(s.id));
      if(!pending.length){ toast("Every student is already on a panel."); return; }
      const load=groupLoad(live);
      const used=new Set(live.map(g=>g.label));
      let made=0,left=0;
      while(pending.length){
        const batch=pending.slice(0,PANEL_CAP);
        const pick=cands
          .filter(m=>!groupClashes([m],batch.map(s=>s.id),students).length)
          .map(m=>({m,n:load.get(memberKey(m))||0}))
          .filter(x=>x.n+batch.length<=PANEL_CAP)
          .sort((a,b)=>a.n-b.n||String(a.m.name).localeCompare(String(b.m.name)))
          .slice(0,PANEL_SIZE);
        if(!pick.length){ left+=batch.length; pending=pending.slice(batch.length); continue; }
        let label=""; for(let i=0;i<26;i++){ const l="Panel "+String.fromCharCode(65+i); if(!used.has(l)){label=l;used.add(l);break;} }
        const members=pick.map(x=>cleanMember(x.m));
        members.forEach(m=>load.set(memberKey(m),(load.get(memberKey(m))||0)+batch.length));
        await saveGroup({label:label||("Panel "+(used.size+1)),members,
          chairKey:availKey(members[0]),studentIds:batch.map(s=>s.id),
          sessions:[],availability:{},chosenSessionId:"",slotMins:PANEL_SLOT_MINS,slots:[]});
        if(members.length>=PANEL_SIZE) made++; else left+=0;
        pending=pending.slice(batch.length);
      }
      toast(made+" panel"+(made===1?"":"s")+" built"+(left?", "+left+" students left over \u2014 not enough independent assessors":"")+
        ". Check the chair, then propose sessions.");
    }catch(err){ toast(err?.message||"Could not build panels.",true); }
    finally{ S.panelSeating=false; }
    reload();
  }

  async function migrateLegacy(){

          const ms=members.map(cleanMember);
          await saveGroup({label:label||("Panel "+(n+1)),members:ms,chairKey:availKey(ms[0]),

// ---- Consultation / weekly-log helpers ----
// The effective time for a given week = week override (if any) else the recurring default.
function weekTime(cons,w){
  const ov=(cons?.weeks?.[w]) || (cons?.weeks?.[String(w)]) || {};
  return {
    day:   ov.day   || cons.day,
    start: ov.start || cons.start,
    end:   ov.end   || cons.end,
    mode:  ov.mode  || cons.mode,
    link:  ov.link  || cons.meetingLink,
    overridden: !!(ov.day||ov.start||ov.end||ov.mode||ov.link)
  };
}
function weekLog(cons,w){ return (cons?.weeks?.[w]) || (cons?.weeks?.[String(w)]) || {}; }

// Every week whose day/time/mode/link was changed away from the recurring slot.
// Returns [{w, et, log}] in week order — used by the week planner, the
// co-supervisor emails and anywhere else the "changed weeks" list is shown.
function changedWeeksOf(cons,totalWeeks){
  const out=[];
  for(let w=1;w<=(totalWeeks||0);w++){
    const et=weekTime(cons,w);
    if(et.overridden) out.push({w,et,log:weekLog(cons,w)});
  }
  return out;
}
// "Thursday 10:00–10:30 (Online)" — one slot as plain text.
function slotText(t){
  if(!t||!t.day) return "no fixed day/time";
  return t.day+" "+(t.start||"?")+"\u2013"+(t.end||"?")+(t.mode?" ("+t.mode+")":"");
}
// The recurring slot of a consultation, as a plain object.
function baseSlot(c){ return {day:c?.day,start:c?.start,end:c?.end,mode:c?.mode}; }

// Which class slots a SUPERVISOR may see:
//  - classes assigned to them by admin, and
//  - for students they co-supervise, ONLY the approved class run by that
//    student's PRINCIPAL supervisor for a unit the student is enrolled in.
// (A unit can have several class groups — one per supervisor/campus — and a
//  co-supervisor must see only their principal's group, not every group.)
function classSlotsFor(tts,myStudents){
  if(S.role!=="supervisor") return tts;
  const coPairs=new Set();
  myStudents
    .filter(s=>s.coUid===S.uid && s.principalUid && s.principalUid!==S.uid)
    .forEach(s=>(s.unitIds||[]).forEach(id=>coPairs.add(id+"|"+s.principalUid)));
  return tts.filter(t=>
    t.supervisorUid===S.uid ||                                          // my own classes
    (t.status==="approved" && coPairs.has(t.unitId+"|"+t.supervisorUid)) // principal's class for my co-students
  );
}

// Current teaching week, derived from the semester's (optional) start date.
// Week 1 begins on the Monday of the week containing the start date.
// Returns null when no start date is set or we're outside the teaching weeks.
function currentWeekOf(sem){
  if(!sem?.start) return null;
  const s=new Date(sem.start+"T00:00:00");
  if(isNaN(s.getTime())) return null;
  const mon=new Date(s); mon.setDate(s.getDate()-((s.getDay()+6)%7));
  const now=new Date(); now.setHours(0,0,0,0);
  const wk=Math.floor((now-mon)/(7*24*3600*1000))+1;
  return (wk>=1 && wk<=(sem.weeks||12)) ? wk : null;
}

// Monday & Saturday dates of a given teaching week (null when no start date).
function semWeekBounds(sem,w){
  if(!sem?.start) return null;
  const s=new Date(sem.start+"T00:00:00");
  if(isNaN(s.getTime())) return null;
  const mon=new Date(s); mon.setDate(s.getDate()-((s.getDay()+6)%7)+(w-1)*7);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);   // weeks run Mon\u2013Sun
  return {mon,sun};
}
function weekRangeLabel(sem,w){
  const b=semWeekBounds(sem,w); if(!b) return "";
  const f=d=>d.getDate()+" "+d.toLocaleString("en",{month:"short"});
  return f(b.mon)+" \u2013 "+f(b.sun);
}
// Reference week for the attendance editing window:
//   before the semester -> 0 (nothing recordable yet)
//   during              -> the current teaching week
//   after it ends       -> the final week (window counts back from there)
//   no start date       -> null (no date-based locking possible)
function lockRefWeek(sem){
  if(!sem?.start) return null;
  const s=new Date(sem.start+"T00:00:00");
  if(isNaN(s.getTime())) return null;
  const mon=new Date(s); mon.setDate(s.getDate()-((s.getDay()+6)%7));
  const now=new Date(); now.setHours(0,0,0,0);
  const wk=Math.floor((now-mon)/(7*24*3600*1000))+1;
  if(wk<1) return 0;
  return Math.min(wk, sem.weeks||12);
}
// counts across a consultation's weeks
function consultStats(cons,totalWeeks){
  let held=0, attended=0, missed=0, logged=0;
  for(let w=1;w<=totalWeeks;w++){
    const l=weekLog(cons,w); if(!Object.keys(l).length) continue;
    if(l.held===true||l.held===false) logged++;
    if(l.held===true){ held++;
      if(l.studentAttended===true) attended++;
      else if(l.studentAttended===false) missed++;
    }
  }
  return {held,attended,missed,logged};
}

/* ------------------------------------------------------------
   3b. SUPERVISION NOTES (message board)
   One thread per student. Principal, co-supervisor, admin and the
   student all post into the same thread, so nobody is working from
   a different copy. `readBy` tracks who has seen each note, which
   drives the unread badge on the tab and the banner shown at login.
   ------------------------------------------------------------ */
// Identity used in readBy / authorUid. Students have no auth account,
// so they are keyed by their student ID.
function noteMeId(){ return S.studentSid ? ("student:"+S.studentSid) : S.uid; }
function noteMeName(){ return S.studentName || S.userName || S.user?.email || "Unknown"; }
// Role of the current viewer *relative to a given student*.
function noteMyRole(stu){
  if(S.studentSid) return "student";
  if(S.role==="admin") return "admin";
  if(stu && stu.coUid===S.uid && stu.principalUid!==S.uid) return "co";
  return "principal";
}
function roleLabel(r){
  return r==="principal"?"Principal supervisor":r==="co"?"Co-supervisor":r==="admin"?"Admin":"Student";
}
function rolePillClass(r){
  return r==="principal"?"held":r==="co"?"blue":r==="admin"?"pending":"none";
}
function isUnread(n,meId){ return !(n.readBy&&n.readBy[meId]) && n.authorUid!==meId; }

// All notes for a set of students, newest first.
// Errors are surfaced, not swallowed: if Firestore rules block the `notes`
// collection the tab would otherwise render as a blank page with no clue why.
async function loadNotes(semesterId,studentIds){
  let all;
  try{
    all=await DB.list("notes", semesterId?{semesterId}:{});
  }catch(err){
    console.error("loadNotes failed",err);
    const e=new Error(err?.message||"Could not read messages");
    e.notesRuleError=true; throw e;
  }
  const set=studentIds?new Set(studentIds):null;
  return all.filter(n=>!set||set.has(n.studentDocId))
            .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
}
async function postNote(stu,text,pinned){
  const t=(text||"").trim();
  if(!t) { toast("Write something first.",true); return false; }
  const meId=noteMeId();
  await DB.add("notes",{
    semesterId:stu.semesterId||S.activeSem, studentDocId:stu.id,
    authorUid:meId, authorName:noteMeName(), authorRole:noteMyRole(stu),
    text:t, createdAt:Date.now(), pinned:!!pinned, readBy:{[meId]:true}
  });
  return true;
}
async function markNotesRead(notes){
  const meId=noteMeId();
  const todo=notes.filter(n=>isUnread(n,meId));
  for(const n of todo){
    await DB.update("notes",n.id,{readBy:{...(n.readBy||{}),[meId]:true}});
    n.readBy={...(n.readBy||{}),[meId]:true};
  }
  return todo.length;
}
function relTime(ms){
  if(!ms) return "";
  const d=Math.floor((Date.now()-ms)/1000);
  if(d<60) return "just now";
  if(d<3600) return Math.floor(d/60)+" min ago";
  if(d<86400) return Math.floor(d/3600)+" h ago";
  if(d<604800) return Math.floor(d/86400)+" d ago";
  return new Date(ms).toLocaleDateString();
}
// Students visible to the current staff user (for the notes tab).
async function myNoteStudents(){
  let students=await DB.list("students", S.activeSem?{semesterId:S.activeSem}:{});
  if(S.role==="supervisor") students=students.filter(s=>s.principalUid===S.uid||s.coUid===S.uid);
  return students;
}

async function studentLookup(sid){

    if(!matches.length){ toast("No student found with that ID — check for a typo (capitals don't matter).",true); return; }
    // carry on with the ID exactly as it is stored, so read receipts on the
    // message board key off one consistent value however it was typed

    await renderStudentView(canonical,matches,sems);

      // strip's highlight went stale (e.g. "My students" stayed selected
      // while Attendance content was showing). Sync the active class here.
      [...tabs.children].forEach(x=>x.classList.toggle("active",x===b));
      drawMain();
    }},label);
    if(id==="notes"){ b.append(el("span",{class:"nbadge",style:"display:none"},"0")); S.notesTabBtn=b; }
    tabs.append(b);
  });
  const main=el("main",{},el("div",{id:"view"}));
  document.body.append(header,el("div",{},main),toastNode());
  main.prepend(tabs);
  drawMain();
  refreshUnreadBadge();
  showInboxBanner();
}

/* Unread count on the Messages tab, refreshed after any note action. */
async function refreshUnreadBadge(){
  try{
    const b=S.notesTabBtn; if(!b||!b.isConnected) return;
    const students=await myNoteStudents();
    const notes=await loadNotes(S.activeSem,students.map(s=>s.id));
    const meId=noteMeId();
    const n=notes.filter(x=>isUnread(x,meId)).length;
    const dot=b.querySelector(".nbadge");
    if(!dot) return;
    dot.textContent=n>99?"99+":String(n);
    dot.style.display=n?"inline-flex":"none";
    S.unreadNotes=n;
  }catch(e){ console.warn("unread badge unavailable:",e?.message||e); }
}

/* Login banner: on sign-in, show what's waiting rather than making the
   user hunt for it. Appears once per session, above the tab content. */
async function showInboxBanner(){
  if(S.bannerShown) return; S.bannerShown=true;
  try{
    const students=await myNoteStudents();
    const notes=await loadNotes(S.activeSem,students.map(s=>s.id));
    const meId=noteMeId();
    const unread=notes.filter(n=>isUnread(n,meId));
    if(!unread.length) return;
    const byStudent=new Map();
    unread.forEach(n=>byStudent.set(n.studentDocId,(byStudent.get(n.studentDocId)||0)+1));
    const names=[...byStudent.keys()].map(id=>students.find(s=>s.id===id)?.name).filter(Boolean);
    const bar=el("div",{class:"card ui inbox-banner",style:"border-left:4px solid var(--blue);margin:0 0 14px;padding:12px 14px"},
      el("div",{class:"row",style:"align-items:center;gap:10px;flex-wrap:wrap"},
        el("span",{class:"pill blue"},"\u2709 "+unread.length+" new message"+(unread.length===1?"":"s")),
        el("span",{class:"ui",style:"font-size:13.5px"},
          "from your supervision threads"+(names.length?" \u00B7 "+names.slice(0,3).join(", ")+(names.length>3?" +"+(names.length-3)+" more":""):"")),
        el("span",{style:"flex:1;min-width:10px"}),
        el("button",{class:"btn sm",onclick:()=>{
          S.tab="notes";
          const strip=document.querySelector("nav.tabs");
          if(strip) [...strip.children].forEach(x=>x.classList.toggle("active",x.textContent.startsWith("Messages")));
          drawMain();

    const main=document.querySelector("main");
    const view=$("#view");
    if(main&&view) main.insertBefore(bar,view);
  }catch(e){ console.warn("messages banner unavailable:",e?.message||e); }
}

          cells.push(el("td",{},el("div",{class:"row"},

        } else if(S.role==="supervisor"){
          // contact via email only — opens the device's mail app
          const contact=el("div",{class:"row",style:"gap:5px"});
          contact.append(emailButton(s.email,"MRes supervision — "+s.name,"Dear "+(s.name||"")+",\n\n","✉ Email","btn xs ghost"));
          // if I'm the co, offer to email the principal and vice versa
          if(s.principalUid && s.principalUid!==S.uid){
            const pEmail=S.supervisors.find(u=>u.id===s.principalUid)?.email;
            contact.append(emailButton(pEmail,"MRes supervision — "+s.name,"Dear "+(s.principalName||"")+",\n\nRegarding "+s.name+" ("+s.sid+"):\n\n","✉ Principal","btn xs ghost"));
          }
          if(s.coUid && s.coUid!==S.uid){
            const cEmail=S.supervisors.find(u=>u.id===s.coUid)?.email;
            contact.append(emailButton(cEmail,"MRes supervision — "+s.name,"Dear "+(s.coName||"")+",\n\nRegarding "+s.name+" ("+s.sid+"):\n\n","✉ Co","btn xs ghost"));
          }
          cells.push(el("td",{},contact));
        }
        tb.append(el("tr",{},...cells));
      });
      t.append(tb); card.append(t); body.append(card);
    });
  }
  search.oninput=render; campusFilter.onchange=render; areaFilter.onchange=render; groupSel.onchange=render;

/* ---- STUDENT IMPORT (CSV file OR pasted rows) ----
   Accepts the supervisor-wise allocation list straight from the spreadsheet:
     Student Name | Student ID | Student Email | Principal Supervisor |
     Principal Supervisor Email | Co-Supervisor Name | Co-supervisor Email
   Tab- or comma-separated, header row required (column order is free — headers
   are matched by meaning). Supervisors are identified by EMAIL, so different
   spellings of the same name ("Associate Professor John Ayoade" vs
   "A/Prof John Ayoade") resolve to one supervisor. Supervisors not yet on the
   staff list are auto-created as profiles (admin adds their login later).
   Re-importing a student ID that already exists in this semester UPDATES that
   student instead of duplicating them. */
function importCSV(done){
  const sem=activeSemester();
  const input=el("input",{type:"file",accept:".csv,.txt,.tsv"});
  const paste=el("textarea",{
    placeholder:"…or paste rows copied from Excel here (header row first).\nExample:\nStudent Name\tStudent ID\tStudent Email\tPrincipal Supervisor\tPrincipal Supervisor Email\tCo-Supervisor Name\tCo-supervisor Email\nHasibul Haque Hira\tcihe260061\tcihe260061@student.cihe.edu.au\tAssociate Professor John Ayoade\tjohn.ayoade@cihe.edu.au\tDr Madhumita Abhijeet Takalkar\tmadhumita.takalkar@cihe.edu.au",
    style:"min-height:130px;font-size:13px;font-family:ui-monospace,monospace"});
  const areaSel=el("select",{},...AREAS.map(a=>el("option",{value:a},a)));
  const preview=el("div",{class:"muted",style:"margin-top:10px"});
  let rows=[];

  function refreshPreview(){
    preview.innerHTML="";
    if(!rows.length){ preview.textContent="No rows detected yet."; return; }
    const missing=rows.filter(r=>!r.name||!r.sid).length;
    const supEmails=new Set();
    rows.forEach(r=>{ if(r.principal_email)supEmails.add(r.principal_email.toLowerCase());
                      if(r.co_email)supEmails.add(r.co_email.toLowerCase()); });
    const newSups=[...supEmails].filter(e=>!S.supervisors.some(u=>(u.email||"").toLowerCase()===e));
    preview.append(el("strong",{},rows.length+" student row"+(rows.length===1?"":"s")+" ready."));
    if(missing) preview.append(" "+missing+" row(s) missing a name or ID will be skipped.");
    if(newSups.length) preview.append(el("div",{style:"margin-top:4px"},
      "New supervisors to be created from email: "+newSups.join(", ")));
  }
  input.onchange=()=>{
    const file=input.files[0]; if(!file)return;
    const r=new FileReader();
    r.onload=()=>{ rows=parseImport(r.result); refreshPreview(); };
    r.readAsText(file);
  };
  let pasteTimer=null;
  paste.addEventListener("input",()=>{ clearTimeout(pasteTimer);
    pasteTimer=setTimeout(()=>{ rows=parseImport(paste.value); refreshPreview(); },350); });

  modal("Import students — CSV or paste",
    el("div",{},
      el("p",{class:"muted",style:"margin-top:0"},
        "Upload a CSV or paste the allocation list per principal supervisor (copied from Excel). "+
        "Needed columns: student name, student ID, student email, principal supervisor (name), principal supervisor email, co-supervisor name, co-supervisor email. "+
        "Supervisors are matched by email — new ones are created automatically. Optional columns: mobile, campus, units (codes separated by ; or |), area."),
      el("div",{style:"margin-bottom:10px"},el("label",{},"Supervision area for this batch"),areaSel,
        el("p",{class:"muted",style:"margin:4px 0 0;font-size:13px"},"Applied to every imported student and any newly created supervisor. Add an \u201Carea\u201D column to mix IT and Business rows in one import.")),
      el("div",{style:"margin-bottom:8px"},el("label",{},"CSV file"),input),
      el("div",{},el("label",{},"Or paste rows"),paste),
      preview),
    async()=>{
      if(!rows.length){ toast("Choose a CSV file or paste rows first.",true); return false; }
      if(!S.activeSem){ toast("Create a semester first.",true); return false; }
      const units=unitsOf(sem);
      const existing=await DB.list("students",{semesterId:S.activeSem});
      const batchArea=areaSel.value;

      // find a supervisor by email; create a profile record if unknown
      async function ensureSupervisor(email,name,rowArea){
        email=(email||"").trim(); if(!email) return null;
        let u=S.supervisors.find(x=>(x.email||"").toLowerCase()===email.toLowerCase());
        if(u) return u;
        const profile={email,name:(name||"").trim()||email,role:"supervisor",supRole:"both",
          area:rowArea||batchArea,mobile:"",pendingLogin:true};
        const id=await DB.add("users",profile);
        u={id,...profile};
        S.supervisors.push(u);
        return u;
      }

      let added=0,updated=0;
      for(const row of rows){
        if(!row.name||!row.sid) continue;
        const rowArea=AREAS.find(a=>a.toLowerCase()===(row.area||"").trim().toLowerCase())||batchArea;
        let p=await ensureSupervisor(row.principal_email,row.principal_name,rowArea);
        let c=await ensureSupervisor(row.co_email,row.co_name,rowArea);
        if(p&&!canBePrincipal(p)) p=null;
        if(c&&!canBeCo(c)) c=null;
        const codes=(row.units||"").split(/[;|]/).map(x=>x.trim().toLowerCase()).filter(Boolean);
        const unitIds=units.filter(u=>codes.includes((u.code||"").toLowerCase())).map(u=>u.id);
        const sid=String(row.sid).trim();
        const data={
          semesterId:S.activeSem,sid,name:row.name.trim(),
          email:(row.email||"").trim(),mobile:(row.mobile||"").trim(),
          campus:(row.campus||"").trim()||"NSW",area:rowArea,
          principalUid:p?.id||"",coUid:c?.id||"",
          principalName:p?.name||p?.email||"",coName:c?.name||c?.email||""
        };
        const prev=existing.find(s=>normSid(s.sid)===normSid(sid));
        if(prev){
          // keep existing unit enrolments unless the import supplies them
          await DB.update("students",prev.id,{...data,unitIds:unitIds.length?unitIds:(prev.unitIds||[])});
          updated++;
        } else {
          await DB.add("students",{...data,unitIds});
          added++;
        }
      }
      S.supervisors=(await DB.listUsers()).filter(u=>u.role==="supervisor");
      toast(`Imported ${added} new, updated ${updated} existing student${(added+updated)===1?"":"s"}.`);
      done(); return true;
    },"Import");
}

// Parse pasted or uploaded rows. Detects tab vs comma delimiter and maps
// header names by meaning ("Student Name", "Principal Supervisor Email",
// "Co-supervisor Email", etc — spacing, case and punctuation don't matter).
function parseImport(text){
  const lines=(text||"").replace(/\r/g,"").split("\n").filter(l=>l.trim().length);
  if(lines.length<2) return [];
  const delim=lines[0].includes("\t")?"\t":",";
  const split=l=>{
    if(delim==="\t") return l.split("\t").map(s=>s.trim());
    const out=[];let cur="",q=false;
    for(const ch of l){ if(ch==='"'){q=!q;} else if(ch===","&&!q){out.push(cur);cur="";} else cur+=ch; }
    out.push(cur); return out.map(s=>s.trim());
  };
  // normalise a header down to letters only, then map to a canonical key
  const canon=h=>{
    const k=h.toLowerCase().replace(/[^a-z]/g,"");
    if(/^(studentname|name|fullname)$/.test(k)) return "name";
    if(/^(studentid|sid|id|studentno|studentnumber)$/.test(k)) return "sid";
    if(/^(studentemail|email)$/.test(k)) return "email";
    if(/^(principalsupervisoremail|principalemail|supervisoremail)$/.test(k)) return "principal_email";
    if(/^(principalsupervisor|principalsupervisorname|principal|principalname|supervisor|supervisorname)$/.test(k)) return "principal_name";
    if(/^(cosupervisoremail|coemail)$/.test(k)) return "co_email";
    if(/^(cosupervisorname|cosupervisor|co|coname)$/.test(k)) return "co_name";
    if(k==="mobile"||k==="phone") return "mobile";
    if(k==="campus") return "campus";
    if(k==="units"||k==="unit") return "units";
    if(k==="area"||k==="supervisionarea"||k==="discipline") return "area";
    return k;
  };
  const headers=split(lines[0]).map(canon);
  return lines.slice(1).map(l=>{ const c=split(l); const o={}; headers.forEach((h,i)=>o[h]=c[i]??""); return o; });
}

async function viewTimetables(v){

      el("button",{class:"btn",onclick:()=>timetableForm(null,()=>viewTimetables(v))},"+ Set class time"));

    myStudents=(await DB.list("students", S.activeSem?{semesterId:S.activeSem}:{}))

  const card=el("div",{class:"card",style:"padding:0;overflow:hidden"});
  const showRoleCol = S.role==="supervisor";
  const t=el("table",{});
  t.append(el("thead",{},el("tr",{},...["Unit","Supervisor",...(showRoleCol?["For you"]:[]),"Day","Time","Room / Campus","Status",""].map(h=>el("th",{},h)))));
  const tb=el("tbody",{});
  tts.sort((a,b)=>DAYS.indexOf(a.day)-DAYS.indexOf(b.day));
  for(const tt of tts){
    const unit=unitById(sem,tt.unitId);

    const actions=el("div",{class:"row"});
    if(S.role==="supervisor"){
      // supervisors never edit class times — admin only
      actions.append(el("span",{class:"muted ui",style:"font-size:12.5px"},"Set by admin"));
    }
    if(S.role==="admin"){
      if(tt.status!=="approved") actions.append(el("button",{class:"btn sm",onclick:async()=>{await DB.update("timetables",tt.id,{status:"approved"});toast("Approved.");viewTimetables(v);}},"Approve"));
      else actions.append(el("button",{class:"btn ghost sm",onclick:async()=>{await DB.update("timetables",tt.id,{status:"pending"});viewTimetables(v);}},"Unapprove"));
      // admin may edit & delete any class time
      actions.append(el("button",{class:"btn ghost sm",onclick:()=>timetableForm(tt,()=>viewTimetables(v))},"Edit"),
        el("button",{class:"btn danger sm",onclick:()=>confirmDelete("timetables",tt.id,"this class time",()=>viewTimetables(v))},"Delete"));
    }
    const roleCell = showRoleCol
      ? el("td",{}, isOwn?el("span",{class:"pill held"},"Your class"):el("span",{class:"pill blue"},"Co-student"))
      : null;
    tb.append(el("tr",{},
      el("td",{},el("strong",{},unit?.code||"—")),
      el("td",{},supName(tt.supervisorUid)),
      ...(roleCell?[roleCell]:[]),
      el("td",{},tt.day),
      el("td",{},`${tt.start}–${tt.end}`),
      el("td",{},tt.room||"—"),
      el("td",{},statusPill(tt.status)),
      el("td",{},actions)));
  }
  t.append(tb); card.append(t); v.append(card);
}

// Admin-only: supervisors can no longer set or change class times.
function timetableForm(existing,done){
  const sem= existing? semOf(existing.semesterId)||activeSemester() : activeSemester();

    ...S.supervisors.filter(canBePrincipal).map(u=>el("option",{value:u.id,...(u.id===existing?.supervisorUid?{selected:"selected"}:{})},
      (u.name||u.email)+(u.area?" ("+u.area+")":""))));
  const day=el("select",{},...DAYS.map(d=>el("option",{value:d,...(d===existing?.day?{selected:"selected"}:{})},d)));
  const start=el("input",{type:"time",value:existing?.start||"10:00"});
  const end=el("input",{type:"time",value:existing?.end||"13:00"});

      el("div",{},el("label",{},"Start"),start),

    ),
